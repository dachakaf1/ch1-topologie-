<style>
/* ===== STYLES DE BASE ===== */
:root{--bg:#090d1a;--panel:#111830;--line:#26305a;--txt:#dfe4f5;--mut:#8d97bd;--teal:#3fd0c9;--amber:#f2b84b;--rose:#ff7a90;--vio:#9b8cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:19px/1.7 Newsreader,Georgia,serif}
h1,h2,h3,nav,.tag,button,summary{font-family:'Space Grotesk',system-ui,sans-serif}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--teal),var(--amber));z-index:20}
#hero{position:relative;height:100vh;min-height:560px;overflow:hidden;display:grid;place-items:center;text-align:center}
#hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hc{position:relative;pointer-events:none;padding:0 20px}
.hc small{color:var(--mut);font:500 15px 'Space Grotesk',sans-serif;letter-spacing:.04em}
.hc h1{font-size:clamp(44px,9vw,110px);line-height:1;margin:.2em 0;letter-spacing:-.03em}
.hc p{max-width:560px;margin:0 auto;color:var(--mut)}
.go{pointer-events:auto;display:inline-block;margin-top:26px;padding:12px 28px;border:1px solid var(--teal);color:var(--teal);border-radius:40px;text-decoration:none;font:500 16px 'Space Grotesk',sans-serif;transition:.2s}
.go:hover{background:var(--teal);color:#05221f}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:40px;padding:0 24px}
nav{position:sticky;top:0;align-self:start;height:100vh;padding:40px 0;overflow:auto;font-size:15px}
nav b{display:block;color:var(--mut);font-weight:500;margin:18px 0 6px}
nav a{display:block;color:var(--txt);text-decoration:none;padding:5px 12px;border-left:2px solid var(--line);opacity:.65}
nav a.on{border-color:var(--amber);opacity:1;color:var(--amber)}
main{padding:60px 0 120px;max-width:820px}
h2{font-size:clamp(28px,4vw,40px);margin:90px 0 10px;letter-spacing:-.02em}
h2:first-child{margin-top:0}
.card{--c:var(--teal);position:relative;margin:28px 0;padding:24px 28px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px 18px 6px 18px;transform-style:preserve-3d;transition:transform .15s,box-shadow .3s;will-change:transform}
.card:hover{box-shadow:0 24px 50px -20px var(--c)}
.card.thm,.card.prop{--c:var(--amber)}.card.ex{--c:var(--vio)}.card.rem{--c:var(--mut)}.card.exo{--c:var(--rose)}
.tag{display:inline-block;font-size:14px;font-weight:700;color:var(--c);margin-bottom:6px;transform:translateZ(30px)}
.card p{margin:.5em 0}.card ul,.card ol{margin:.4em 0;padding-left:1.3em}
.card i{color:#fff}
o{border-top:1.5px solid currentColor;line-height:1}
details{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--c);font-weight:500;font-size:16px;list-style:none}
summary::before{content:'▸ ';display:inline-block;transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}
.pf{margin-top:10px;padding-left:16px;border-left:2px solid var(--line);color:#c8cfea}
.pf p{margin:.35em 0}.pf em{color:var(--teal);font-style:normal;font-family:'Space Grotesk',sans-serif;font-size:15px}
.qed{float:right;color:var(--mut)}
.card{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:8px 28px;align-items:start}
.card.nf{display:block}
.fig{margin:0;position:sticky;top:20px;transform:translateZ(40px)}
.fig canvas{width:100%;aspect-ratio:3/2;display:block;border-radius:12px;background:radial-gradient(circle at 50% 40%,#1a2350,#0a0f20 75%);border:1px solid var(--line)}
.fig figcaption{font:13px/1.4 'Space Grotesk',sans-serif;color:var(--mut);margin-top:8px}
.tb{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.tb button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#0a0f20cc;color:var(--txt);cursor:pointer;font-size:15px}
.tb button:hover{border-color:var(--teal);color:var(--teal)}
.tip{display:none;position:absolute;left:8px;right:8px;bottom:34px;background:#05081af2;border:1px solid var(--amber);border-radius:10px;padding:8px 10px;font:13px/1.4 'Space Grotesk',sans-serif;pointer-events:none}
.tip b{display:block;color:var(--amber)}
.fig canvas{touch-action:pan-y;cursor:grab}
.fig.big{position:fixed;inset:2vh 2vw;z-index:60;background:#05081a;padding:14px;border-radius:18px;box-shadow:0 0 0 100vmax #000b;display:flex;flex-direction:column;align-items:center;transform:none}
.fig.big canvas{width:min(94vw,calc(80vh*1.5))}
.fig.big .tb{top:20px;right:20px}.fig.big .tip{bottom:60px}.fig.big figcaption{font-size:15px}
.st{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.st button{background:none;border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:14px}
.st button:hover{border-color:var(--teal);color:var(--teal)}
.st span{color:var(--mut);font:14px 'Space Grotesk',sans-serif;margin:0 4px}
.pf p.cur{background:#3fd0c914;border-radius:6px;padding:4px 8px;margin-left:-8px}
@media(max-width:860px){.card{grid-template-columns:1fr}.fig{order:-1;position:static}}
footer{text-align:center;color:var(--mut);padding:40px;border-top:1px solid var(--line);font-size:15px}
@media(max-width:860px){.wrap{display:block}nav{display:none}body{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
a:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ===== EFFETS VISUELS ===== */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@property --th{syntax:'<color>';inherits:true;initial-value:#3fd0c9}
@property --r{syntax:'<length>';inherits:false;initial-value:0px}
:root{--th:#3fd0c9;transition:--th 1.2s ease}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.neb{position:fixed;z-index:-1;pointer-events:none;width:70vmax;height:70vmax;border-radius:50%;animation:drift 40s ease-in-out infinite alternate;will-change:transform;background:radial-gradient(circle,color-mix(in srgb,var(--th) 20%,transparent),transparent 65%)!important}
.n1{left:-20vmax;top:-15vmax}.n2{right:-25vmax;top:30vh;animation-duration:55s}.n3{left:20vw;bottom:-35vmax;animation-duration:47s;animation-delay:-12s}
@keyframes drift{to{transform:translate(12vw,-8vh) scale(1.25) rotate(40deg)}}
#glow{position:fixed;left:0;top:0;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:5;background:radial-gradient(circle,#3fd0c91c,transparent 62%);mix-blend-mode:screen}
#bar{box-shadow:0 0 14px var(--th),0 0 30px #3fd0c966;background:linear-gradient(90deg,var(--th),var(--amber))}
.hc{will-change:transform,opacity}
.hc h1{background:linear-gradient(100deg,#fff 10%,var(--teal) 30%,var(--vio) 50%,var(--amber) 70%,#fff 90%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite;filter:drop-shadow(0 0 28px #3fd0c955)}
@keyframes shine{to{background-position:-300% 0}}
.hc::before,.hc::after{content:'';position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none}
.hc::before{width:min(78vw,720px);aspect-ratio:1;border:1px dashed #3fd0c94d;transform:translate(-50%,-50%) rotateX(72deg) rotateZ(0);animation:orb 30s linear infinite;box-shadow:0 0 40px #3fd0c91f inset}
.hc::after{width:min(56vw,520px);aspect-ratio:1;border:1px solid #f2b84b40;transform:translate(-50%,-50%) rotateX(72deg) rotateY(25deg) rotateZ(0);animation:orb 22s linear infinite reverse}
@keyframes orb{to{rotate:360deg}}
.mouse{position:absolute;bottom:30px;left:50%;translate:-50% 0;width:24px;height:38px;border:2px solid var(--mut);border-radius:14px}
.mouse i{position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--teal);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
.card{background:linear-gradient(135deg,#141c3ccc,#0b1128b8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:visible}
.card::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--a),transparent 60%,var(--c) 85%,#fff 92%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .4s;animation:spin 4s linear infinite}
.card:hover::before{opacity:1}
@keyframes spin{to{--a:360deg}}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c) 16%,transparent),transparent 70%)}
.card:hover::after{opacity:1}
.js .card:not(.in){opacity:0}
.js .card.in{animation:rise .95s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(60px) scale(.96)}}
.tag{text-shadow:0 0 14px var(--c)}
h2{background:linear-gradient(90deg,#fff,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
h2::after{content:'';display:block;height:3px;width:110px;margin-top:12px;border-radius:3px;background:linear-gradient(90deg,var(--amber),var(--rose),transparent);background-size:200% 100%;animation:shine 5s linear infinite;box-shadow:0 0 16px var(--amber)}
nav a{transition:.25s}nav a:hover{transform:translateX(5px);opacity:1}
nav a.on{border-left-width:3px;color:var(--th);border-color:var(--th);text-shadow:0 0 14px var(--th)}
.fig canvas{box-shadow:0 0 30px -8px var(--c),inset 0 0 40px #3fd0c911}
.go{box-shadow:0 0 24px #3fd0c933;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 44px #3fd0c977}}
@media(pointer:coarse){#glow{display:none}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important}.js .card:not(.in){opacity:1}}

/* ===== TOOLS / PALETTE / GLOSSAIRE ===== */
#tools{position:fixed;top:12px;right:14px;z-index:40;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#tools button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--txt);cursor:pointer;font:500 14px 'Space Grotesk',sans-serif}
#tools button:hover{border-color:var(--th);color:var(--th)}
#tools kbd{opacity:.55;font:inherit;margin-left:8px;font-size:12px}
#pal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:#02041099;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#pal.on{display:flex}
#pal .bx{width:min(640px,92vw);background:var(--panel);border:1px solid var(--th);border-radius:16px;box-shadow:0 30px 80px -20px var(--th);overflow:hidden}
#pal input{width:100%;padding:18px 20px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:18px 'Space Grotesk',sans-serif;outline:0}
#pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#pal li{padding:10px 14px;border-radius:10px;cursor:pointer;font:15px/1.4 'Space Grotesk',sans-serif}
#pal li.sel{background:color-mix(in srgb,var(--th) 18%,transparent)}
#pal li b{display:block}
#pal li span{color:var(--mut);font-size:13px}
#pal .ft{padding:8px 14px;color:var(--mut);font:12px 'Space Grotesk',sans-serif;border-top:1px solid var(--line)}
.card.flash{outline:2px solid var(--th);outline-offset:6px;box-shadow:0 0 60px var(--th)}
.gl{border-bottom:1px dotted var(--th);cursor:help}
.gl:hover{color:var(--th)}
#gtip{position:fixed;z-index:70;width:290px;padding:12px 14px;background:var(--panel);border:1px solid var(--th);border-radius:12px;box-shadow:0 20px 50px -15px #000;font:14px/1.45 'Space Grotesk',sans-serif;pointer-events:none;opacity:0;transform:translateY(6px);transition:.18s;color:var(--txt)}
#gtip.on{opacity:1;transform:none}
#gtip b{display:block;color:var(--th);margin-bottom:4px}
#gtip svg{float:right;width:84px;height:64px;margin:0 0 4px 10px;color:var(--th)}
[data-theme=light]{--bg:#f3f5fb;--panel:#fff;--line:#cdd5ee;--txt:#1a2140;--mut:#59638a;--teal:#0b9a93;--amber:#b57300;--rose:#d1355a;--vio:#6552e0;color-scheme:light}
[data-theme=light] .card{background:linear-gradient(135deg,#ffffffee,#eef1fbd9)}
[data-theme=light] .card i{color:#000}
[data-theme=light] .pf{color:#2b3358}
[data-theme=light] h2{background:linear-gradient(90deg,#1a2140,var(--teal));-webkit-background-clip:text;background-clip:text}
[data-theme=light] .hc h1{background:linear-gradient(100deg,#1a2140 10%,var(--teal) 30%,var(--vio) 50%,var(--amber) 70%,#1a2140 90%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
[data-theme=light] #stars{opacity:.25}
[data-theme=light] .neb{opacity:.55}
[data-theme=light] #glow{display:none}
[data-theme=light] .go:hover{color:#fff}
[data-theme=light] .tip{background:#fffffff2;color:var(--txt)}
[data-theme=light] .fig.big{background:#fff}
[data-theme=light] .tb button{background:#fffc}
[data-theme=light] #pal{background:#dfe4f599}
@media print{
 #ld,#hero,nav,#bar,#tools,#pal,#gtip,#glow,#stars,.neb,#morph,.fig,.st,footer,#graph{display:none!important}
 html,body{background:#fff!important}
 body{color:#111!important;font-size:12pt}
 .wrap{display:block;max-width:none;padding:0}
 main{max-width:none;padding:0}
 .card{display:block!important;background:none!important;-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid #bbb;border-left:4px solid #333;break-inside:avoid-page;opacity:1!important;animation:none!important;transform:none!important;margin:14px 0}
 .card::before,.card::after{display:none}
 .card *{color:#111!important;text-shadow:none!important}
 h2{color:#111!important;-webkit-text-fill-color:#111;background:none!important;margin:24px 0 8px;break-after:avoid}
 h2::after{display:none}
 .pf p{display:block!important;background:none!important}
 .gl{border:0}
}

/* ===== LOADER / MORPH ===== */
#c{opacity:0}
#morph{position:fixed;z-index:1;pointer-events:none;right:6vw;top:50%;width:min(520px,60vw);aspect-ratio:1;transform:translateY(-50%);transition:all .9s cubic-bezier(.2,.8,.2,1)}
#morph.dock{right:auto;left:24px;top:auto;bottom:24px;width:190px;transform:none;opacity:.9}
@media(max-width:860px){#morph.dock{display:none}#morph:not(.dock){right:50%;transform:translate(50%,-50%);width:80vw;opacity:.35}}
#ld{position:fixed;inset:0;z-index:100;background:#090d1a;display:grid;place-items:center;cursor:pointer;--r:0px;-webkit-mask:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 2px));mask:radial-gradient(circle at 50% 50%,transparent var(--r),#000 calc(var(--r) + 2px));transition:--r 1.3s cubic-bezier(.6,0,.2,1)}
#ld canvas{width:min(80vw,420px);aspect-ratio:1}
#ld.out{--r:150vmax}

/* ===== GRAPHE 3D ===== */
#graph{position:fixed;inset:0;z-index:84;display:none;background:#02040ecc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px}
#graph.on{display:flex}
#graph .box{width:min(1200px,96vw);height:min(760px,92vh);background:radial-gradient(circle at 50% 40%,#0f1730,#040714 75%);border:1px solid var(--th);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 40px 100px -30px var(--th)}
#graph canvas{width:100%;height:100%;display:block}
#graph .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#0a0f20cc;color:var(--txt);cursor:pointer;font-size:18px;z-index:2}
#graph .close:hover{border-color:var(--th);color:var(--th)}
#graph .info{position:absolute;left:14px;bottom:14px;right:14px;background:#05081add;border:1px solid var(--th);border-radius:10px;padding:12px 16px;font:14px/1.5 'Space Grotesk',sans-serif;color:var(--txt);pointer-events:none;opacity:0;transition:.2s}
#graph .info.on{opacity:1}
#graph .info b{color:var(--th)}
#graph .tip{position:absolute;top:14px;left:14px;font:12px 'Space Grotesk',sans-serif;color:var(--mut);background:#05081acc;padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
#tools #bGraph{color:var(--th)}
#tools #bGraph:hover{background:var(--th);color:#05221f}

/* ===== PERF PATCH ===== */
.card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#10173a!important}
[data-theme=light] .card{background:#fff!important}
.neb{animation:none!important;will-change:auto}
#glow{display:none!important}
.hc h1{animation:none!important;filter:none!important}
h2::after{animation:none!important;box-shadow:none!important}
.go,.hc::before,.hc::after{animation:none!important}
.card::before{display:none}
#bar{box-shadow:none;width:100%!important;transform-origin:left;transform:scaleX(0)}
:root{transition:none!important}
</style>
</head>

    <a class="go" href="#s1">Commencer le cours</a>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav>

</div>
<footer>Réalisé par [Ton nom] · Topologie Générale</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== CONTENU DU COURS ===== */
const C=[
{id:'s1',h:'1.1 Définitions et exemples',items:[
{t:'def',n:'1.1.1',ti:'Topologie',b:`<p>Soit <i>E</i> un ensemble non vide. Une <b>topologie</b> sur <i>E</i> est une famille τ de parties de <i>E</i> telle que :</p><ol type="i"><li>∅ ∈ τ et <i>E</i> ∈ τ ;</li><li>l’intersection de deux éléments de τ est dans τ ;</li><li>toute réunion (finie ou infinie) d’éléments de τ est dans τ.</li></ol><p>Les éléments de τ sont les <b>ouverts</b>. Le couple (<i>E</i>, τ) est un <b>espace topologique</b>.</p>`},
{t:'ex',n:'1.1.2',ti:'Exemples fondamentaux',b:`<ul><li><b>Topologie discrète</b> τ<sub>d</sub> = 𝒫(<i>E</i>) : toute partie est ouverte.</li><li><b>Topologie grossière</b> τ<sub>g</sub> = {∅, <i>E</i>}.</li><li>Sur <i>E</i> = {a, b} : τ₁ = {∅, {a}, <i>E</i>} et τ₂ = {∅, {b}, <i>E</i>} sont des topologies.</li><li>Sur ℝ : la <b>topologie usuelle</b> τ<sub>u</sub> est formée de ∅, ℝ et des réunions quelconques d’intervalles ]a, b[.</li></ul>`},
{t:'exo',n:'1.1.3',ti:'Exercice',b:`<p>Montrer que la famille formée de ∅, ℝ et des intervalles ]a, b[ n’est pas une topologie sur ℝ.</p>`,p:`<p><em>Idée.</em> Il faut chercher une réunion qui sort de la famille.</p><p>]0,1[ et ]2,3[ sont dans la famille, mais ]0,1[ ∪ ]2,3[ n’est ni ∅, ni ℝ, ni un intervalle. L’axiome iii) échoue.</p>`},
{t:'exo',n:'1.1.4',ti:'Exercice',b:`<p>Une topologie sur <i>E</i> est discrète ⇔ tout singleton est ouvert.</p>`,p:`<p><em>(⇒)</em> Si τ = 𝒫(<i>E</i>), chaque {x} est une partie, donc un ouvert.</p><p><em>(⇐)</em> Soit A ⊂ <i>E</i>. Alors A = ⋃<sub>x∈A</sub> {x} est une réunion d’ouverts, donc A ∈ τ. Ainsi τ = 𝒫(<i>E</i>). <span class="qed">∎</span></p>`},
{t:'def',n:'1.1.5',ti:'Fermé',b:`<p>Une partie <i>F</i> de <i>E</i> est un <b>fermé</b> si son complémentaire <i>F</i><sup>c</sup> est un ouvert.</p><p>Pour τ₁ = {∅, {a}, <i>E</i>}, les fermés sont ∅, {b}, <i>E</i>.</p>`},
{t:'rem',n:'1.1.7',ti:'Remarques',b:`<ul><li>Les ouverts sont stables par réunion quelconque et intersection finie ; les fermés par intersection quelconque et réunion finie.</li><li>Dans ℝ : ]a,b[ est ouvert non fermé ; [a,b] est fermé non ouvert ; ]a,b] n’est ni l’un ni l’autre.</li><li>∅ et <i>E</i> sont à la fois ouverts et fermés.</li><li>Une intersection infinie d’ouverts n’est pas toujours ouverte : ⋂<sub>n≥1</sub> ]−1/n, 1/n[ = {0}.</li><li>Une réunion infinie de fermés n’est pas toujours fermée : ⋃<sub>n≥1</sub> [1/n, 1] = ]0, 1].</li></ul>`},
{t:'def',n:'1.1.8',ti:'Voisinage',b:`<p>Soit x ∈ <i>E</i>. Une partie <i>U</i> est un <b>voisinage</b> de x s’il existe un ouvert <i>W</i> tel que x ∈ <i>W</i> ⊂ <i>U</i>. On note 𝒱<sub>x</sub> l’ensemble des voisinages de x.</p><p>Exemple : pour τ₁ sur {a,b}, {b} n’est pas un voisinage de b, mais <i>E</i> l’est.</p>`},
{t:'thm',n:'1.1.11',ti:'Caractérisation des ouverts',b:`<p><i>A</i> ⊂ <i>E</i> est ouvert ⇔ <i>A</i> est un voisinage de chacun de ses points.</p>`,p:`<p><em>(⇒)</em> Évident : A est un ouvert contenant x et contenu dans A.</p><p><em>(⇐)</em> Pour tout x ∈ A, il existe un ouvert O<sub>x</sub> avec x ∈ O<sub>x</sub> ⊂ A.</p><p>Donc ⋃<sub>x∈A</sub> O<sub>x</sub> ⊂ A, et A ⊂ ⋃<sub>x∈A</sub> O<sub>x</sub> car x ∈ O<sub>x</sub>.</p><p>Ainsi A = ⋃<sub>x∈A</sub> O<sub>x</sub> est une réunion d’ouverts, donc un ouvert. <span class="qed">∎</span></p>`},
{t:'def',n:'1.1.12',ti:'Base d’ouverts, base de voisinages',b:`<ul><li>Une famille 𝓑 ⊂ τ est une <b>base d’ouverts</b> si tout ouvert est réunion d’éléments de 𝓑.</li><li>𝓑<sub>x</sub> ⊂ 𝒱<sub>x</sub> est une <b>base de voisinages</b> de x si ∀V ∈ 𝒱<sub>x</sub>, ∃b ∈ 𝓑<sub>x</sub>, x ∈ b ⊂ V.</li></ul><p>Exemples : les singletons pour la discrète ; les ]a,b[ pour ℝ ; (]x−1/n, x+1/n[)<sub>n≥1</sub> en x. En revanche, les ]−∞,a[ et ]a,+∞[ ne forment pas une base de τ<sub>u</sub>.</p>`},
{t:'prop',n:'1.1.14',ti:'Base d’ouverts ⇔ bases de voisinages',b:`<p>𝓑 ⊂ τ est une base d’ouverts ⇔ pour tout x, 𝓑<sub>x</sub> = {b ∈ 𝓑 : x ∈ b} est une base de voisinages de x.</p>`,p:`<p><em>(⇒)</em> Soit V ∈ 𝒱<sub>x</sub> : il existe W ouvert, x ∈ W ⊂ V. Comme W = ⋃ b<sub>i</sub> (b<sub>i</sub> ∈ 𝓑), x appartient à un b<sub>i₀</sub>, d’où x ∈ b<sub>i₀</sub> ⊂ V.</p><p><em>(⇐)</em> Soit O ouvert et x ∈ O. O ∈ 𝒱<sub>x</sub>, donc il existe b<sub>x</sub> ∈ 𝓑 avec x ∈ b<sub>x</sub> ⊂ O. Alors O = ⋃<sub>x∈O</sub> b<sub>x</sub>. <span class="qed">∎</span></p>`},
{t:'def',n:'1.1.15',ti:'Espace séparé (Hausdorff)',b:`<p>(<i>E</i>, τ) est <b>séparé</b> si pour x ≠ x′ il existe W ∈ 𝒱<sub>x</sub> et W′ ∈ 𝒱<sub>x′</sub> avec W ∩ W′ = ∅. De façon équivalente, on peut prendre W, W′ ouverts.</p><p>La topologie grossière n’est pas séparée ; la discrète et (ℝ, τ<sub>u</sub>) le sont.</p>`},
{t:'prop',n:'1.1.18',ti:'Singletons fermés',b:`<p>Dans un espace séparé, tout singleton est fermé.</p>`,p:`<p>Soit x ∈ <i>E</i>. Montrons que {x}<sup>c</sup> est ouvert.</p><p>Soit x′ ∈ {x}<sup>c</sup>, donc x ≠ x′. Il existe des ouverts W ∋ x et W′ ∋ x′ disjoints. Alors x ∉ W′, donc W′ ⊂ {x}<sup>c</sup>.</p><p>Ainsi {x}<sup>c</sup> est un voisinage de chacun de ses points : c’est un ouvert (th. 1.1.11), et {x} est fermé. <span class="qed">∎</span></p>`}
]},
{id:'s2',h:'1.2 Intérieur, adhérence, frontière',items:[
{t:'def',n:'1.2.1',ti:'Les cinq notions',b:`<p>Soit A ⊂ <i>E</i> et a ∈ <i>E</i>.</p><ul><li><b>Intérieur</b> : a est intérieur à A si A ∈ 𝒱<sub>a</sub>. On note A° l’ensemble de ces points.</li><li><b>Adhérence</b> : a est adhérent à A si ∀V ∈ 𝒱<sub>a</sub>, V ∩ A ≠ ∅. On note <o>A</o>.</li><li><b>Point d’accumulation</b> : ∀V ∈ 𝒱<sub>a</sub>, V ∩ (A∖{a}) ≠ ∅.</li><li><b>Point isolé</b> : ∃V ∈ 𝒱<sub>a</sub>, V ∩ A = {a}.</li><li><b>Frontière</b> : ∂A = <o>A</o> ∖ A°.</li></ul>`},
{t:'ex',n:'1.2.2',ti:'Exemples',b:`<ul><li>τ₁ = {∅,{a},<i>E</i>}, A = {b} : A° = ∅, <o>A</o> = {b}, ∂A = {b}, b est isolé, aucun point d’accumulation.</li><li>Discrète, A ≠ ∅ : A° = <o>A</o> = A, ∂A = ∅, tous les points sont isolés.</li><li>ℝ usuelle, A = ]a,b] : A° = ]a,b[, <o>A</o> = [a,b], aucun point isolé.</li></ul>`},
{t:'prop',n:'1.2.3',ti:'Propriétés de l’intérieur et de l’adhérence',b:`<ol><li>A° ⊂ A ⊂ <o>A</o>.</li><li>A° est un ouvert.</li><li>A° est le plus grand ouvert contenu dans A : A° = ⋃<sub>O⊂A</sub> O.</li><li>(<o>A</o>)<sup>c</sup> = (A<sup>c</sup>)° ; <o>A</o> est un fermé.</li><li><o>A</o> est le plus petit fermé contenant A : <o>A</o> = ⋂<sub>A⊂F</sub> F.</li></ol>`,p:`<p><em>2.</em> Soit a ∈ A° : il existe un ouvert W avec a ∈ W ⊂ A. Pour x ∈ W, A est un voisinage de x, donc x ∈ A° : W ⊂ A°. Ainsi A° est voisinage de chacun de ses points, donc ouvert.</p><p><em>3.</em> Soit U ouvert, U ⊂ A. Pour x ∈ U, A est voisinage de x, donc U ⊂ A°. Avec 1. et 2., A° est le plus grand.</p><p><em>4.</em> x ∈ (<o>A</o>)<sup>c</sup> ⇔ ∃V ∈ 𝒱<sub>x</sub>, V ∩ A = ∅ ⇔ ∃V ∈ 𝒱<sub>x</sub>, V ⊂ A<sup>c</sup> ⇔ x ∈ (A<sup>c</sup>)°. Comme (A<sup>c</sup>)° est ouvert, <o>A</o> est fermé.</p><p><em>5.</em> Soit F fermé, A ⊂ F. Alors F<sup>c</sup> est un ouvert inclus dans A<sup>c</sup>, donc F<sup>c</sup> ⊂ (A<sup>c</sup>)° = (<o>A</o>)<sup>c</sup>, c’est-à-dire <o>A</o> ⊂ F. <span class="qed">∎</span></p>`},
{t:'prop',n:'1.2.4–1.2.6',ti:'Autres propriétés',b:`<ul><li>∂A = <o>A</o> ∩ <o>A<sup>c</sup></o>.</li><li>A ⊂ B ⇒ A° ⊂ B° et <o>A</o> ⊂ <o>B</o>.</li><li>U ouvert ⇔ U° = U ; F fermé ⇔ <o>F</o> = F.</li><li><o>A ∪ B</o> = <o>A</o> ∪ <o>B</o> ; (A ∩ B)° = A° ∩ B°.</li><li><o>A ∩ B</o> ⊂ <o>A</o> ∩ <o>B</o> ; A° ∪ B° ⊂ (A ∪ B)°.</li></ul>`,p:`<p><em>Pour ∂A.</em> ∂A = <o>A</o> ∩ (A°)<sup>c</sup>. Or (A°)<sup>c</sup> = <o>A<sup>c</sup></o> (appliquer 1.2.3 (4) à A<sup>c</sup>). D’où ∂A = <o>A</o> ∩ <o>A<sup>c</sup></o>. <span class="qed">∎</span></p>`}
]},
{id:'s3',h:'1.3 Topologie induite, quotient, produit',items:[
{t:'prop',n:'1.3.1',ti:'Topologie induite',b:`<p>Soit A ⊂ <i>E</i>. La famille τ<sub>A</sub> = {O ∩ A : O ∈ τ} est une topologie sur A, appelée <b>topologie induite</b>. (A, τ<sub>A</sub>) est un <b>sous-espace</b>.</p>`,p:`<p>∅ = ∅ ∩ A et A = <i>E</i> ∩ A.</p><p>Si U = O₁ ∩ A et V = O₂ ∩ A, alors U ∩ V = (O₁ ∩ O₂) ∩ A avec O₁ ∩ O₂ ∈ τ.</p><p>Si u<sub>i</sub> = O<sub>i</sub> ∩ A, alors ⋃ u<sub>i</sub> = (⋃ O<sub>i</sub>) ∩ A avec ⋃ O<sub>i</sub> ∈ τ. <span class="qed">∎</span></p>`},
{t:'ex',n:'1.3.4',ti:'Un ouvert de A pas ouvert de E',b:`<p>Dans ℝ, A = [−1, 1]. L’ensemble ]0,1] = A ∩ ]0,+∞[ est ouvert dans A, mais ni ouvert ni fermé dans ℝ. En général, les ouverts de τ<sub>A</sub> ne sont pas des ouverts de (<i>E</i>, τ).</p>`},
{t:'prop',n:'1.3.5',ti:'Voisinages dans un sous-espace',b:`<p>Pour a ∈ A : V est un voisinage de a dans A ⇔ V = W ∩ A avec W voisinage de a dans <i>E</i>.</p>`,p:`<p><em>(⇒)</em> V voisinage de a dans A : il existe U ∈ τ<sub>A</sub>, a ∈ U ⊂ V, avec U = W ∩ A, W ouvert de <i>E</i>. Posons O = W ∪ V : c’est un voisinage de a dans <i>E</i>, et O ∩ A = (W ∩ A) ∪ (V ∩ A) = U ∪ V = V.</p><p><em>(⇐)</em> Si W ∈ 𝒱<sub>a</sub>, il existe U ouvert avec a ∈ U ⊂ W. Alors a ∈ U ∩ A ⊂ W ∩ A, et U ∩ A ∈ τ<sub>A</sub>. Donc W ∩ A est un voisinage de a dans A. <span class="qed">∎</span></p>`},
{t:'def',n:'1.3.6',ti:'Topologie quotient',b:`<p>Soit ℛ une relation d’équivalence sur <i>E</i>, <i>Ê</i> = <i>E</i>/ℛ et q : <i>E</i> → <i>Ê</i>, x ↦ [x] la surjection canonique. La famille <b>τ̂ = {U ⊂ <i>Ê</i> : q<sup>−1</sup>(U) ∈ τ}</b> est une topologie sur <i>Ê</i> : c’est la <b>topologie quotient</b>.</p>`},
{t:'def',n:'1.3.8',ti:'Topologie produit',b:`<p>Soit (<i>E<sub>i</sub></i>, τ<sub>i</sub>)<sub>1≤i≤n</sub> et <i>E</i> = <i>E</i>₁ × … × <i>E<sub>n</sub></i>. La famille τ<sub>π</sub> des réunions de produits u₁ × … × u<sub>n</sub> avec u<sub>i</sub> ∈ τ<sub>i</sub> est une topologie sur <i>E</i> : la <b>topologie produit</b>.</p>`}
]},
{id:'s4',h:'1.4 Applications continues',items:[
{t:'def',n:'1.4.1',ti:'Limite',b:`<p>f : <i>E</i> → <i>F</i> <b>tend vers</b> b quand x → a si pour tout voisinage V de b, il existe un voisinage U de a avec f(U) ⊂ V. Si <i>F</i> n’est pas séparé, il peut y avoir plusieurs limites : dans le grossier, tout point est limite.</p>`},
{t:'thm',n:'1.4.4',ti:'Unicité de la limite',b:`<p>Si <i>F</i> est séparé et si f admet une limite en a, alors cette limite est unique.</p>`,p:`<p>Supposons deux limites b ≠ b′. Par séparation, il existe V ∈ 𝒱<sub>b</sub>, V′ ∈ 𝒱<sub>b′</sub> avec V ∩ V′ = ∅.</p><p>Il existe U, U′ ∈ 𝒱<sub>a</sub> avec f(U) ⊂ V et f(U′) ⊂ V′. Alors U ∩ U′ ∈ 𝒱<sub>a</sub> et f(U ∩ U′) ⊂ V ∩ V′ = ∅.</p><p>Or a ∈ U ∩ U′, donc f(a) ∈ f(U ∩ U′) : contradiction. <span class="qed">∎</span></p>`},
{t:'def',n:'1.4.5',ti:'Continuité',b:`<p>f est <b>continue en a</b> si f tend vers f(a) quand x → a. Elle est continue sur A ⊂ <i>E</i> si elle l’est en tout point de A, et <b>continue</b> si elle l’est sur <i>E</i>.</p>`},
{t:'thm',n:'1.4.6',ti:'Caractérisations de la continuité',b:`<p>Pour f : (<i>E</i>, τ) → (<i>F</i>, τ′), il y a équivalence entre :</p><ol type="a"><li>f est continue ;</li><li>l’image réciproque de tout ouvert de <i>F</i> est un ouvert ;</li><li>l’image réciproque de tout fermé de <i>F</i> est un fermé ;</li><li>∀A ⊂ <i>E</i>, f(<o>A</o>) ⊂ <o>f(A)</o>.</li></ol>`,p:`<p><em>a ⇒ d.</em> Soit a ∈ <o>A</o> et W ∈ 𝒱<sub>f(a)</sub>. Par continuité, ∃U ∈ 𝒱<sub>a</sub>, f(U) ⊂ W. Comme a est adhérent à A, U ∩ A ≠ ∅, donc f(U ∩ A) ≠ ∅ et f(U ∩ A) ⊂ W ∩ f(A). Donc W ∩ f(A) ≠ ∅ : f(a) ∈ <o>f(A)</o>.</p><p><em>d ⇒ c.</em> Soit V fermé de <i>F</i>, W = f<sup>−1</sup>(V). Alors f(W) ⊂ V, donc <o>f(W)</o> ⊂ <o>V</o> = V. Pour x ∈ <o>W</o> : f(x) ∈ f(<o>W</o>) ⊂ <o>f(W)</o> ⊂ V, donc x ∈ W. Ainsi <o>W</o> = W : W est fermé.</p><p><em>c ⇒ b.</em> Soit U ouvert de <i>F</i> : U<sup>c</sup> est fermé, donc f<sup>−1</sup>(U<sup>c</sup>) = (f<sup>−1</sup>(U))<sup>c</sup> est fermé, et f<sup>−1</sup>(U) est ouvert.</p><p><em>b ⇒ a.</em> Soit x₀ ∈ <i>E</i> et V ∈ 𝒱<sub>f(x₀)</sub> : il existe W ouvert, f(x₀) ∈ W ⊂ V. Posons U = f<sup>−1</sup>(W) : ouvert contenant x₀, et f(U) ⊂ W ⊂ V. Donc f est continue en x₀. <span class="qed">∎</span></p>`},
{t:'prop',n:'1.4.7',ti:'Composition',b:`<p>La composée de deux applications continues est continue.</p>`,p:`<p>Soit f : <i>E</i> → <i>F</i> et g : <i>F</i> → <i>H</i> continues, V ouvert de <i>H</i>. Alors (g∘f)<sup>−1</sup>(V) = f<sup>−1</sup>(g<sup>−1</sup>(V)). g<sup>−1</sup>(V) est ouvert, puis f<sup>−1</sup>(g<sup>−1</sup>(V)) aussi. On conclut par 1.4.6 (b). <span class="qed">∎</span></p>`},
{t:'def',n:'1.4.8',ti:'Homéomorphisme',b:`<p>f : <i>E</i> → <i>F</i> est un <b>homéomorphisme</b> si elle est bijective, continue, et de réciproque f<sup>−1</sup> continue. <i>E</i> et <i>F</i> sont <b>homéomorphes</b> s’il existe un homéomorphisme de <i>E</i> dans <i>F</i>.</p>`},
{t:'exo',n:'1.4.9',ti:'Exercices',b:`<ol><li>Id : (<i>E</i>, τ) → (<i>E</i>, τ′) est un homéomorphisme ⇔ τ = τ′.</li><li>f : (<i>E</i>, τ) → (<i>F</i>, τ′) est un homéomorphisme ⇔ U ↦ f(U) est une bijection de τ sur τ′.</li></ol>`,p:`<p><em>1.</em> Id continue ⇔ τ′ ⊂ τ (image réciproque d’un ouvert de τ′ = lui-même). Id<sup>−1</sup> = Id continue ⇔ τ ⊂ τ′. Donc homéomorphisme ⇔ τ = τ′.</p><p><em>2.</em> Si f est un homéomorphisme, U ↦ f(U) = (f<sup>−1</sup>)<sup>−1</sup>(U) envoie τ dans τ′, et V ↦ f<sup>−1</sup>(V) est son inverse. Réciproquement, si cette application est bijective de τ sur τ′, alors f est bijective (cas U = <i>E</i>, etc.), f<sup>−1</sup> est continue car (f<sup>−1</sup>)<sup>−1</sup>(U) = f(U) ∈ τ′, et f est continue car tout V ∈ τ′ s’écrit f(U), donc f<sup>−1</sup>(V) = U ∈ τ. <span class="qed">∎</span></p>`}
]}
];

/* 4. KaTeX */

const tex=h=>h.replace(/<sup>(.*?)<\/sup>/g,'^{$1}').replace(/<sub>(.*?)<\/sub>/g,'_{$1}').replace(/<[^>]+>/g,'').replace(/[∈∉⊂≥≤∪∩∖∅−⋃⋂]/g,c=>U[c]);
const K=t=>{try{return katex.renderToString(t,{throwOnError:false})}catch(e){return t}};

   torus:(u,v)=>{const a=u*6.2832,b=v*6.2832,Rr=1.7+.65*Math.cos(b);return[Rr*Math.cos(a),.65*Math.sin(b),Rr*Math.sin(a)]},
   knot:(u,v)=>{const c=p=>new V(Math.sin(p)+2*Math.sin(2*p),Math.cos(p)-2*Math.cos(2*p),-Math.sin(3*p)).multiplyScalar(.6),
     a=u*6.2832,e=.01,p0=c(a-e),p1=c(a),p2=c(a+e),T2=p2.clone().sub(p0).normalize(),
     Nn=p2.clone().add(p0).sub(p1.clone().multiplyScalar(2)).normalize(),Bn=new V().crossVectors(T2,Nn),b=v*6.2832,r=.33,
     q=p1.clone().add(Nn.multiplyScalar(r*Math.cos(b))).add(Bn.multiplyScalar(r*Math.sin(b)));return[q.x,q.y,q.z]},
   mobius:(u,v)=>{const a=u*6.2832,s=(v-.5)*1.3,Rr=1.7+s*Math.cos(a/2);return[Rr*Math.cos(a),s*Math.sin(a/2),Rr*Math.sin(a)]}
  };
  const TG={};NAMES.forEach(k=>{const a=new Float32Array(cnt*3);for(let i=0;i<cnt;i++)a.set(F[k]((i%(N+1))/N,((i/(N+1))|0)/M2),i*3);TG[k]=a});
  pos.array.set(TG.knot);
  const mat=new THREE.MeshBasicMaterial({color:0x3fd0c9,wireframe:true,transparent:true,opacity:.5}),mesh=new THREE.Mesh(geo,mat),S=new THREE.Scene();S.add(mesh);

    const tg=TG[k<0?'knot':NAMES[k]],a=pos.array;
    for(let i=0;i<a.length;i++)a[i]+=(tg[i]-a[i])*.07;pos.needsUpdate=true;
    tc.set(PAL[isLight()?1:0][k<0?0:k]);mat.color.lerp(tc,.06);
    mesh.rotation.set(.5+my*.8,(still?0:performance.now()*.0004)+mx*1.5,0);
    R.render(S,cam)})();
  morph={to:n=>{k=n}};
}

<script>
(function(){

    ['1.1.8','1.1.11'],['1.1.11','1.1.18'],['1.1.8','1.1.14'],['1.1.12','1.1.14'],

    requestAnimationFrame(loop);
    if(!GRAPH.classList.contains('on'))return;
    tx+=(mx*2-tx)*0.05;ty+=(my*2-ty)*0.05;
    if(!still)rotY+=0.0015;
    const total=rotY+tx;
    Object.values(nodes).forEach(n=>{
      const c=Math.cos(total),s=Math.sin(total);
      const x=n.pos.x*c-n.pos.z*s,z=n.pos.x*s+n.pos.z*c;
      n.mesh.position.set(x,n.pos.y+ty,z);n.ring.position.set(x,n.pos.y+ty,z);
    });
    lines.forEach(({a,b,line})=>{
      const p=line.geometry.attributes.position;
      p.setXYZ(0,a.mesh.position.x,a.mesh.position.y,a.mesh.position.z);
      p.setXYZ(1,b.mesh.position.x,b.mesh.position.y,b.mesh.position.z);
      p.needsUpdate=true;
    });
    cam.position.x=Math.sin(total*0.3)*1;cam.position.y=ty*3;cam.lookAt(0,0,0);
    R.render(S,cam);
  })();
  $('.close',GRAPH).onclick=()=>GRAPH.classList.remove('on');
  GRAPH.addEventListener('click',e=>{if(e.target===GRAPH)GRAPH.classList.remove('on')});
  addEventListener('keydown',e=>{if(e.key==='Escape')GRAPH.classList.remove('on')});
  window._openGraph=()=>{GRAPH.classList.add('on');setTimeout(resize,60)};
})();

(function(){
  let tools=$('#tools');
  if(!tools){tools=document.createElement('div');tools.id='tools';tools.style.cssText='position:fixed;top:12px;right:14px;z-index:40;display:flex;gap:6px;flex-wrap:wrap';B.append(tools)}
  if($('#bGraph'))return;
  const btn=document.createElement('button');btn.id='bGraph';btn.textContent='🌐 Graphe';
  btn.style.cssText='height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--th);cursor:pointer;font:500 14px "Space Grotesk",sans-serif';
  btn.onclick=window._openGraph;tools.append(btn);
})();

addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='g'&&!e.ctrlKey&&!e.metaKey&&window._openGraph){window._openGraph();e.preventDefault()}
});
})();
</script>
</body>

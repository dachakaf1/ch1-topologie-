<header><canvas id="sp"></canvas><canvas id="hc"></canvas><small>Cours · Semestre 5</small><h1>Topologie & Espaces vectoriels normés</h1><p>Topologie générale, compacité, connexité, EVN, Banach, topologie de ℝⁿ, limites, continuité et calcul différentiel.</p></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<footer>Réalisé par [Ton nom] · Topologie & Analyse</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const C=[
{id:'s1',h:'Chap. 1 · Espaces topologiques',items:[
{t:'def',n:'1.1',ti:'Topologie',b:`<p>Soit <i>E</i> ≠ ∅. Une <b>topologie</b> τ est une famille de parties de <i>E</i> telle que : (i) ∅, <i>E</i> ∈ τ ; (ii) l’intersection de deux éléments de τ est dans τ ; (iii) toute réunion (finie ou infinie) d’éléments de τ est dans τ. Les éléments de τ sont les <b>ouverts</b> ; (<i>E</i>,τ) est un <b>espace topologique</b>.</p>`},
{t:'ex',n:'1.2',ti:'Exemples',b:`<ul><li><b>Discrète</b> τ<sub>d</sub> = 𝒫(<i>E</i>) ; <b>grossière</b> τ<sub>g</sub> = {∅, <i>E</i>}.</li><li>Sur {a,b} : {∅,{a},<i>E</i>} est une topologie.</li><li>Sur ℝ : topologie usuelle = réunions d’intervalles ]a,b[.</li></ul>`},
{t:'exo',n:'1.3',ti:'Exercices',b:`<p>(1) ∅, ℝ et les ]a,b[ ne forment pas une topologie. (2) Une topologie est discrète ⇔ tout singleton est ouvert.</p>`,p:`<p>(1) ]0,1[ ∪ ]2,3[ n’est pas dans la famille : (iii) échoue.</p><p>(2) (⇐) A = ⋃<sub>x∈A</sub>{x} est réunion d’ouverts. <span class="qed">∎</span></p>`},
{t:'def',n:'1.4',ti:'Fermé et voisinage',b:`<p>Un <b>fermé</b> est une partie dont le complémentaire est ouvert. <i>U</i> est un <b>voisinage</b> de x s’il existe un ouvert W avec x ∈ W ⊂ <i>U</i> ; on note 𝒱<sub>x</sub> l’ensemble des voisinages.</p>`},
{t:'rem',n:'1.5',ti:'Remarques',b:`<ul><li>Ouverts : stables par réunion quelconque, intersection finie. Fermés : l’inverse.</li><li>∅ et <i>E</i> sont ouverts et fermés ; ]a,b] n’est ni l’un ni l’autre dans ℝ.</li><li>⋂ ]−1/n,1/n[ = {0} : une intersection infinie d’ouverts n’est pas ouverte.</li><li>⋃ [1/n,1] = ]0,1] : une réunion infinie de fermés n’est pas fermée.</li></ul>`},
{t:'thm',n:'1.6',ti:'Caractérisation des ouverts',b:`<p>A est ouvert ⇔ A est voisinage de chacun de ses points.</p>`,p:`<p>(⇐) Pour x ∈ A, il existe un ouvert O<sub>x</sub> avec x ∈ O<sub>x</sub> ⊂ A.</p><p>Donc A = ⋃<sub>x∈A</sub> O<sub>x</sub>, réunion d’ouverts : A est ouvert. <span class="qed">∎</span></p>`},
{t:'def',n:'1.7',ti:'Bases',b:`<p>𝓑 ⊂ τ est une <b>base d’ouverts</b> si tout ouvert est réunion d’éléments de 𝓑. 𝓑<sub>x</sub> ⊂ 𝒱<sub>x</sub> est une <b>base de voisinages</b> de x si ∀V ∈ 𝒱<sub>x</sub>, ∃b ∈ 𝓑<sub>x</sub>, x ∈ b ⊂ V. Exemple : (]x−1/n, x+1/n[)<sub>n≥1</sub> en x ; les ]−∞,a[, ]a,+∞[ ne forment pas une base de τ<sub>u</sub>.</p>`},
{t:'prop',n:'1.8',ti:'Base ⇔ bases de voisinages',b:`<p>𝓑 est une base d’ouverts ⇔ pour tout x, {b ∈ 𝓑 : x ∈ b} est une base de voisinages de x.</p>`,p:`<p>(⇒) V ∈ 𝒱<sub>x</sub> ⊃ W ouvert ∋ x ; W = ⋃b<sub>i</sub>, donc x ∈ b<sub>i₀</sub> ⊂ V.</p><p>(⇐) O ouvert : pour x ∈ O il existe b<sub>x</sub> avec x ∈ b<sub>x</sub> ⊂ O, d’où O = ⋃ b<sub>x</sub>. <span class="qed">∎</span></p>`},
{t:'def',n:'1.9',ti:'Espace séparé (Hausdorff)',b:`<p>Pour x ≠ x′ il existe des voisinages (ou des ouverts) disjoints. Grossière : non séparée ; discrète et (ℝ,τ<sub>u</sub>) : séparées.</p>`},
{t:'prop',n:'1.10',ti:'Singletons fermés',b:`<p>Dans un espace séparé, tout singleton est fermé.</p>`,p:`<p>Soit x′ ≠ x : il existe W ∋ x et W′ ∋ x′ ouverts disjoints, donc W′ ⊂ {x}<sup>c</sup>.</p><p>{x}<sup>c</sup> est voisinage de chacun de ses points : ouvert. <span class="qed">∎</span></p>`},
{t:'def',n:'1.11',ti:'Intérieur, adhérence, frontière',b:`<ul><li><b>Intérieur</b> A° : points a tels que A ∈ 𝒱<sub>a</sub>.</li><li><b>Adhérence</b> <o>A</o> : points a tels que ∀V ∈ 𝒱<sub>a</sub>, V ∩ A ≠ ∅.</li><li><b>Point d’accumulation</b> : ∀V, V ∩ (A∖{a}) ≠ ∅. <b>Point isolé</b> : ∃V, V ∩ A = {a}.</li><li><b>Frontière</b> ∂A = <o>A</o> ∖ A°.</li></ul><p>Exemple : ℝ, A = ]a,b] : A° = ]a,b[, <o>A</o> = [a,b].</p>`},
{t:'prop',n:'1.12',ti:'Propriétés',b:`<ol><li>A° ⊂ A ⊂ <o>A</o> ; A° est ouvert, <o>A</o> est fermé.</li><li>A° = plus grand ouvert inclus dans A ; <o>A</o> = plus petit fermé contenant A.</li><li>(<o>A</o>)<sup>c</sup> = (A<sup>c</sup>)° ; ∂A = <o>A</o> ∩ <o>A<sup>c</sup></o>.</li><li>A ⊂ B ⇒ A° ⊂ B° et <o>A</o> ⊂ <o>B</o> ; U ouvert ⇔ U° = U ; F fermé ⇔ <o>F</o> = F.</li><li><o>A∪B</o> = <o>A</o> ∪ <o>B</o> ; (A∩B)° = A° ∩ B° ; <o>A∩B</o> ⊂ <o>A</o> ∩ <o>B</o> ; A° ∪ B° ⊂ (A∪B)°.</li></ol>`,p:`<p><em>A° ouvert.</em> a ∈ A° : ∃W ouvert, a ∈ W ⊂ A ; tout x ∈ W a A comme voisinage, donc W ⊂ A°.</p><p><em>Plus grand ouvert.</em> U ouvert ⊂ A ⇒ A voisinage de tout x ∈ U ⇒ U ⊂ A°.</p><p><em>Complémentaire.</em> x ∉ <o>A</o> ⇔ ∃V ∈ 𝒱<sub>x</sub>, V ∩ A = ∅ ⇔ x ∈ (A<sup>c</sup>)°.</p><p><em>Plus petit fermé.</em> A ⊂ F fermé ⇒ F<sup>c</sup> ⊂ A<sup>c</sup> ouvert ⇒ F<sup>c</sup> ⊂ (A<sup>c</sup>)° = (<o>A</o>)<sup>c</sup>. <span class="qed">∎</span></p>`},
{t:'prop',n:'1.13',ti:'Topologie induite',b:`<p>Pour A ⊂ <i>E</i>, τ<sub>A</sub> = {O ∩ A : O ∈ τ} est une topologie sur A. Les ouverts de A ne sont pas toujours ouverts de <i>E</i> : dans ℝ, ]0,1] = [−1,1] ∩ ]0,+∞[ est ouvert dans [−1,1] mais pas dans ℝ. V est voisinage de a dans A ⇔ V = W ∩ A avec W ∈ 𝒱<sub>a</sub>(<i>E</i>).</p>`,p:`<p>∅ = ∅∩A, A = <i>E</i>∩A ; (O₁∩A)∩(O₂∩A) = (O₁∩O₂)∩A ; ⋃(O<sub>i</sub>∩A) = (⋃O<sub>i</sub>)∩A. <span class="qed">∎</span></p>`},
{t:'def',n:'1.14',ti:'Topologies quotient et produit',b:`<ul><li><b>Quotient</b> : ℛ relation d’équivalence, q : <i>E</i> → <i>E</i>/ℛ ; τ̂ = {U : q<sup>−1</sup>(U) ∈ τ}.</li><li><b>Produit</b> : τ<sub>π</sub> = réunions de u₁×…×u<sub>n</sub> avec u<sub>i</sub> ∈ τ<sub>i</sub>.</li></ul>`},
{t:'def',n:'1.15',ti:'Limite et continuité',b:`<p>f tend vers b en a si ∀V ∈ 𝒱<sub>b</sub>, ∃U ∈ 𝒱<sub>a</sub>, f(U) ⊂ V. f est <b>continue en a</b> si f tend vers f(a). Si l’arrivée est grossière, tout point est limite.</p>`},
{t:'thm',n:'1.16',ti:'Unicité de la limite',b:`<p>Si l’espace d’arrivée est séparé, la limite est unique.</p>`,p:`<p>Deux limites b ≠ b′ : V ∩ V′ = ∅ avec V ∈ 𝒱<sub>b</sub>, V′ ∈ 𝒱<sub>b′</sub>.</p><p>Il existe U, U′ ∈ 𝒱<sub>a</sub> avec f(U) ⊂ V, f(U′) ⊂ V′, donc f(U∩U′) ⊂ V∩V′ = ∅, alors que a ∈ U∩U′ : contradiction. <span class="qed">∎</span></p>`},
{t:'thm',n:'1.17',ti:'Caractérisations de la continuité',b:`<p>Équivalence : (a) f continue ; (b) image réciproque d’un ouvert = ouvert ; (c) image réciproque d’un fermé = fermé ; (d) ∀A, f(<o>A</o>) ⊂ <o>f(A)</o>.</p>`,p:`<p><em>a⇒d.</em> a ∈ <o>A</o>, W ∈ 𝒱<sub>f(a)</sub> : ∃U, f(U) ⊂ W ; U∩A ≠ ∅ donc W∩f(A) ≠ ∅ : f(a) ∈ <o>f(A)</o>.</p><p><em>d⇒c.</em> V fermé, W = f<sup>−1</sup>(V) : f(<o>W</o>) ⊂ <o>f(W)</o> ⊂ V, donc <o>W</o> ⊂ W.</p><p><em>c⇒b.</em> Passer au complémentaire. <em>b⇒a.</em> V ∈ 𝒱<sub>f(x₀)</sub> ⊃ W ouvert ; U = f<sup>−1</sup>(W) convient. <span class="qed">∎</span></p>`},
{t:'prop',n:'1.18',ti:'Composition, homéomorphisme',b:`<p>La composée de deux continues est continue : (g∘f)<sup>−1</sup>(V) = f<sup>−1</sup>(g<sup>−1</sup>(V)). Un <b>homéomorphisme</b> est une bijection continue de réciproque continue. Id : (<i>E</i>,τ) → (<i>E</i>,τ′) est un homéomorphisme ⇔ τ = τ′.</p>`}
]},
{id:'s2',h:'Chap. 2 · Espaces compacts – Espaces connexes',items:[
{t:'def',n:'2.1',ti:'Compact',b:`<p>Un <b>recouvrement ouvert</b> de <i>E</i> est une famille d’ouverts de réunion <i>E</i>. <i>E</i> est <b>compact</b> s’il est séparé et si de tout recouvrement ouvert on peut extraire un sous-recouvrement fini (Borel-Lebesgue). ℝ n’est pas compact : (]−∞,n[)<sub>n</sub> n’a pas de sous-recouvrement fini.</p>`},
{t:'thm',n:'2.2',ti:'Version fermés',b:`<p>E compact ⇔ pour toute famille de fermés d’intersection vide, une sous-famille finie est d’intersection vide. En particulier une suite décroissante de fermés d’intersection vide est stationnaire en ∅.</p>`,p:`<p>Passer aux complémentaires : (⋂F<sub>i</sub>)<sup>c</sup> = ⋃F<sub>i</sub><sup>c</sup>, et F<sub>i</sub> fermé ⇔ F<sub>i</sub><sup>c</sup> ouvert. <span class="qed">∎</span></p>`},
{t:'thm',n:'2.3',ti:'Compact ⇒ fermé (espace séparé)',b:`<p>Toute partie compacte d’un espace séparé est fermée.</p>`,p:`<p>Soit x ∉ A. Pour tout y ∈ A il existe O<sub>xy</sub> ∋ x et O<sub>y</sub> ∋ y disjoints.</p><p>A ⊂ O<sub>y₁</sub> ∪ … ∪ O<sub>yₙ</sub> (compacité). O = ⋂O<sub>xy<sub>i</sub></sub> est un ouvert contenant x, disjoint de A : A<sup>c</sup> est voisinage de chacun de ses points. <span class="qed">∎</span></p>`},
{t:'thm',n:'2.4',ti:'Fermé d’un compact',b:`<p>Tout fermé d’un espace compact est compact. Une réunion finie de compacts est compacte ; une intersection quelconque de compacts est compacte.</p>`},
{t:'thm',n:'2.5',ti:'Image d’un compact',b:`<p>Si f est continue et A compact, f(A) est compact. Conséquence : toute continue d’un compact dans ℝ admet un max et un min. Une bijection continue d’un compact dans un séparé est un homéomorphisme. (Tychonoff) Un produit fini d’espaces séparés est compact ⇔ chaque facteur l’est.</p>`,p:`<p>Soit f(A) ⊂ ⋃U<sub>i</sub>. Alors A ⊂ ⋃f<sup>−1</sup>(U<sub>i</sub>), recouvrement ouvert : sous-recouvrement fini I₀, donc f(A) ⊂ ⋃<sub>I₀</sub>U<sub>i</sub>. <span class="qed">∎</span></p>`},
{t:'rem',n:'2.6',ti:'Remarque',b:`<p>L’image réciproque d’un compact n’est pas toujours compacte (f constante).</p>`},
{t:'def',n:'2.7',ti:'Localement compact',b:`<p>Séparé, et tout point possède un voisinage compact (ex : ℝ). Alors tout point a un système fondamental de voisinages compacts. <b>Compactifié d’Alexandroff</b> : <i>E</i> s’identifie au complémentaire d’un point ω (« point à l’infini ») dans un compact Ê.</p>`},
{t:'def',n:'2.8',ti:'Connexe',b:`<p><i>E</i> est <b>connexe</b> s’il n’admet pas de partition en deux ouverts non vides.</p>`},
{t:'thm',n:'2.9',ti:'Caractérisations',b:`<p>Équivalence : (a) E connexe ; (b) pas de partition en deux fermés ; (c) seules parties ouvertes et fermées : ∅ et E ; (d) toute continue E → {0,1} (discret) est constante.</p>`,p:`<p>a⇒b, b⇒c : si F est ouvert-fermé, E = F ∪ F<sup>c</sup>.</p><p>c⇒d : f<sup>−1</sup>({0}) est ouvert-fermé. d⇒a : sinon E = F ∪ F′ et f = 1<sub>F</sub> est continue non constante. <span class="qed">∎</span></p>`},
{t:'thm',n:'2.10',ti:'Image d’un connexe',b:`<p>L’image d’un connexe par une continue est connexe ; un quotient d’un connexe est connexe. ℝ est connexe.</p>`,p:`<p>Si f(E) = A ⊔ B (ouverts), alors E = f<sup>−1</sup>(A) ⊔ f<sup>−1</sup>(B), partition en deux ouverts : contradiction. <span class="qed">∎</span></p>`},
{t:'def',n:'2.11',ti:'Connexe par arcs',b:`<p>Un <b>chemin</b> de a à b est une application continue f : [α,β] → E avec f(α)=a, f(β)=b. <i>E</i> est <b>connexe par arcs</b> si deux points quelconques sont joints par un chemin. Alors E est connexe (la réciproque est fausse). ℝⁿ, les segments et les pavés sont connexes par arcs ; l’image continue d’un connexe par arcs l’est aussi (h = f∘g).</p>`}
]},
{id:'s3',h:'Chap. 3 · Espaces vectoriels normés et Banach',items:[
{t:'def',n:'3.1',ti:'Norme',b:`<p>Soit <i>E</i> un 𝕂-ev (𝕂 = ℝ ou ℂ). Une <b>norme</b> est ‖·‖ : <i>E</i> → ℝ₊ telle que : (i) ‖x‖ = 0 ⇔ x = 0 ; (ii) ‖λx‖ = |λ|‖x‖ ; (iii) ‖x+y‖ ≤ ‖x‖+‖y‖. Un <b>evn</b> est un couple (<i>E</i>,‖·‖). Remarque : si (i) est remplacée par p(0)=0, c’est une semi-norme.</p>`},
{t:'prop',n:'3.2',ti:'Inégalité triangulaire renversée',b:`<p>∀x,y : |‖x‖ − ‖y‖| ≤ ‖x−y‖.</p>`,p:`<p>x = (x−y)+y donne ‖x‖−‖y‖ ≤ ‖x−y‖.</p><p>En échangeant x et y : ‖y‖−‖x‖ ≤ ‖y−x‖ = ‖x−y‖. <span class="qed">∎</span></p>`},
{t:'ex',n:'3.3',ti:'Normes usuelles',b:`<ul><li>Sur ℝⁿ : ‖x‖₁ = Σ|x<sub>i</sub>|, ‖x‖₂ = (Σx<sub>i</sub>²)<sup>1/2</sup> (euclidienne), ‖x‖<sub>∞</sub> = sup|x<sub>i</sub>|.</li><li>Sur 𝒞([a,b]) : ‖f‖<sub>∞</sub> = sup|f|, ‖f‖₁ = ∫|f|, ‖f‖₂ = (∫f²)<sup>1/2</sup>, ‖f‖<sub>α</sub> = (∫|f|<sup>α</sup>)<sup>1/α</sup> (Minkowski).</li><li>Suites : ℓ¹, ℓ², ℓ<sup>∞</sup>, c₀.</li></ul>`,p:`<p><em>‖·‖₁ sur ℝⁿ.</em> ‖x‖₁ = 0 ⇔ tous les |x<sub>i</sub>| = 0 ⇔ x = 0. |x<sub>i</sub>+y<sub>i</sub>| ≤ |x<sub>i</sub>|+|y<sub>i</sub>|, on somme. ‖λx‖₁ = |λ|‖x‖₁.</p><p><em>‖·‖₁ sur 𝒞([0,1]).</em> ∫|f| = 0 avec f continue ⇒ |f| = 0 partout ⇒ f = 0. <span class="qed">∎</span></p>`},
{t:'prop',n:'3.4',ti:'Distance associée',b:`<p>Une <b>distance</b> d vérifie : d(x,y)=0 ⇔ x=y ; symétrie ; d(x,y) ≤ d(x,z)+d(z,y). Toute norme définit d(x,y) = ‖x−y‖, invariante par translation, avec d(λx,λy) = |λ|d(x,y).</p>`},
{t:'def',n:'3.5',ti:'Normes équivalentes',b:`<p>N₁ et N₂ sont <b>équivalentes</b> s’il existe α, β > 0 avec αN₁ ≤ N₂ ≤ βN₁. Exemple : ‖x‖<sub>∞</sub> ≤ ‖x‖₁ ≤ n‖x‖<sub>∞</sub> sur ℝⁿ.</p>`},
{t:'thm',n:'3.6',ti:'Dimension finie',b:`<p>Sur un ev de dimension finie, toutes les normes sont équivalentes. Donc tout evn de dimension n est homéomorphe à 𝕂ⁿ, ses compacts sont les fermés bornés, et il est complet.</p>`,p:`<p>Base (e<sub>k</sub>), p(x) = Σ|a<sub>k</sub>|. Alors ‖x‖ ≤ b·p(x) avec b = max‖e<sub>k</sub>‖, donc ‖·‖ est continue pour p.</p><p>La sphère M = {Σ|α<sub>k</sub>| = 1} est compacte dans ℝⁿ ; son image K = {p = 1} est compacte, donc ‖·‖ atteint un minimum a > 0 sur K.</p><p>Par homogénéité : a·p(x) ≤ ‖x‖ ≤ b·p(x). <span class="qed">∎</span></p>`},
{t:'def',n:'3.7',ti:'Boules et sphères',b:`<p>B(a,r) = {x : ‖x−a‖ < r} (ouverte), B<sub>F</sub>(a,r) = {‖x−a‖ ≤ r} (fermée), S(a,r) = {‖x−a‖ = r}. Dans ℝ : ]a−r,a+r[, [a−r,a+r], {a−r,a+r}. Dans ℝ² : boule unité = disque pour ‖·‖₂, losange pour ‖·‖₁, carré pour ‖·‖<sub>∞</sub>. Une partie est <b>bornée</b> si elle est incluse dans une boule.</p>`},
{t:'thm',n:'3.8',ti:'Topologie de la norme',b:`<p>A est ouvert ⇔ A = ∅ ou ∀a ∈ A, ∃r>0, B(a,r) ⊂ A. Les boules ouvertes sont ouvertes et forment une base ; (B(a,1/n)) est une base de voisinages de a. Cette topologie est séparée : B(x,r) ∩ B(y,r) = ∅ pour r = ‖x−y‖/2.</p>`,p:`<p>Intersection : B(x,r₁) ⊂ A, B(x,r₂) ⊂ B ⇒ B(x,min(r₁,r₂)) ⊂ A∩B. Réunion : x ∈ A<sub>i₀</sub> ⇒ B(x,r) ⊂ A<sub>i₀</sub> ⊂ ⋃A<sub>i</sub>. <span class="qed">∎</span></p>`},
{t:'prop',n:'3.9',ti:'Suites',b:`<p>a<sub>n</sub> → a ⇔ ‖a<sub>n</sub>−a‖ → 0. La limite est unique, une suite convergente est bornée, ses sous-suites ont la même limite, et ‖a<sub>n</sub>‖ → ‖a‖.</p>`},
{t:'thm',n:'3.10',ti:'Caractérisation séquentielle',b:`<p>a ∈ <o>A</o> ⇔ il existe une suite de A qui converge vers a. Donc A fermé ⇔ A contient les limites de ses suites convergentes. K est compact ⇔ de toute suite de K on extrait une sous-suite convergeant dans K ; un compact est fermé borné.</p>`,p:`<p>(⇒) B(x,1/n)∩A ≠ ∅ : choisir x<sub>n</sub> dedans, ‖x<sub>n</sub>−x‖ < 1/n.</p><p>(⇐) x<sub>n</sub> → x : pour tout ε, x<sub>n</sub> ∈ B(x,ε)∩A pour n grand. <span class="qed">∎</span></p>`},
{t:'prop',n:'3.11',ti:'Continuité',b:`<p>f est continue en x₀ ⇔ ∀ε ∃r (‖x−x₀‖<r ⇒ ‖f(x)−f(x₀)‖′<ε) ⇔ pour toute suite x<sub>n</sub> → x₀, f(x<sub>n</sub>) → f(x₀). Uniformément continue : r indépendant de x. Lipschitzienne ⇒ uniformément continue ⇒ continue. x ↦ ‖x‖ est 1-lipschitzienne ; x ↦ u+x et x ↦ λx (λ≠0) sont des homéomorphismes.</p>`},
{t:'thm',n:'3.12',ti:'Riesz',b:`<p>Un evn est de dimension finie ⇔ il est localement compact ⇔ sa boule unité fermée est compacte.</p>`},
{t:'thm',n:'3.13',ti:'Critère de continuité linéaire',b:`<p>Pour f linéaire, équivalence : (a) continue en 0 ; (b) ∃M, ∀x ∈ B(0,1), ‖f(x)‖′ ≤ M ; (c) ∃M, ∀x, ‖f(x)‖′ ≤ M‖x‖ ; (d) uniformément continue. En dimension finie, toute application linéaire est lipschitzienne.</p>`,p:`<p>a⇒b : pour ε=1, ∃r, ‖y‖<r ⇒ ‖f(y)‖′<1. Pour x ∈ B(0,1), y = rx donne ‖f(x)‖′ ≤ 1/r.</p><p>b⇒c : appliquer b à x/‖x‖. c⇒d : f est M-lipschitzienne. d⇒a : évident. <span class="qed">∎</span></p>`},
{t:'ex',n:'3.14',ti:'Linéaire non continue',b:`<p>E = 𝒞^∞([0,2π]) avec ‖·‖<sub>∞</sub>, φ(f) = f′. Pour f<sub>n</sub> = sin(nx)/√n : ‖f<sub>n</sub>‖ = 1/√n → 0 mais ‖φ(f<sub>n</sub>)‖ = √n → ∞ : φ n’est pas continue.</p>`},
{t:'def',n:'3.15',ti:'Suites de Cauchy, Banach',b:`<p>(x<sub>n</sub>) est de Cauchy si ∀ε ∃n₀, n,m ≥ n₀ ⇒ ‖x<sub>n</sub>−x<sub>m</sub>‖ ≤ ε. <i>E</i> est <b>complet</b> si toute suite de Cauchy converge ; un <b>espace de Banach</b> est un evn complet. Exemples : ℝ, ℂ, 𝕂ⁿ, (𝒞([a,b]),‖·‖<sub>∞</sub>). En revanche (𝒞([a,b]),‖·‖<sub>α</sub>) n’est pas complet. Un produit fini de Banach est Banach ; un evn isométrique à un Banach est Banach.</p>`}
]},
{id:'s4',h:'Chap. 4 · Topologie de ℝⁿ (boules, ouverts, suites, compacité)',items:[
{t:'def',n:'4.1',ti:'Ouvert de ℝⁿ',b:`<p>Ω ⊂ ℝⁿ est ouvert ⇔ ∀x ∈ Ω, ∃r>0, B(x,r) ⊂ Ω. Les trois normes usuelles étant équivalentes, on peut utiliser n’importe laquelle. Exemples : ]1,3[×]2,5[ est ouvert dans ℝ² ; ]−1,1]×[2,4[ ne l’est pas.</p>`},
{t:'prop',n:'4.2',ti:'Propriétés des ouverts',b:`<p>(i) Toute boule ouverte est ouverte ; (ii) ∅ et ℝⁿ sont ouverts ; (iii) une intersection finie d’ouverts est ouverte ; (iv) une réunion quelconque d’ouverts est ouverte. Une partie est ouverte ⇔ c’est une réunion de boules ouvertes.</p>`,p:`<p><em>(i)</em> x ∈ B(a,r), e = r−‖x−a‖ > 0. Si y ∈ B(x,e) : ‖y−a‖ ≤ ‖y−x‖+‖x−a‖ < r, donc B(x,e) ⊂ B(a,r).</p><p><em>(iii)</em> x ∈ ⋂O<sub>i</sub> : B(x,r<sub>i</sub>) ⊂ O<sub>i</sub> ; r = min r<sub>i</sub> > 0 convient.</p><p><em>(iv)</em> x ∈ O<sub>i₀</sub> ⇒ B(x,r) ⊂ O<sub>i₀</sub> ⊂ ⋃O<sub>i</sub>. <span class="qed">∎</span></p>`},
{t:'prop',n:'4.3',ti:'Fermés et bornés',b:`<p>F est fermé ⇔ F<sup>c</sup> ouvert. Toute boule fermée est fermée ; ∅, ℝⁿ sont fermés ; réunion finie et intersection quelconque de fermés sont fermées. X est <b>borné</b> si ∃A>0, ∀x ∈ X, ‖x‖₂ ≤ A.</p>`},
{t:'def',n:'4.4',ti:'Convergence dans ℝⁿ',b:`<p>x<sub>m</sub> → ℓ si ‖x<sub>m</sub>−ℓ‖<sub>∞</sub> → 0. La limite est unique. x<sub>m</sub> → ℓ ⇔ chaque coordonnée x<sub>m</sub><sup>i</sup> → ℓ<sup>i</sup>.</p>`,p:`<p>Si ℓ ≠ ℓ′ sont deux limites, pour ε = ‖ℓ−ℓ′‖ et m grand : ‖ℓ−ℓ′‖ ≤ ‖ℓ−x<sub>m</sub>‖+‖x<sub>m</sub>−ℓ′‖ < ε/2 : absurde. <span class="qed">∎</span></p>`},
{t:'prop',n:'4.5',ti:'Fermé ⇔ F = F̄',b:`<p>x est adhérent à A ⇔ x est limite d’une suite de A. Donc F est fermé ⇔ F = <o>F</o>.</p>`,p:`<p>(⇒) F ⊂ <o>F</o> (suite constante). Si x ∈ <o>F</o> ∖ F, x ∈ F<sup>c</sup> ouvert : B(x,r) ⊂ F<sup>c</sup>, mais x<sub>m</sub> ∈ F tend vers x : contradiction.</p><p>(⇐) Si F<sup>c</sup> n’est pas ouvert : ∃x ∈ F<sup>c</sup> avec B(x,1/m) ∩ F ≠ ∅ pour tout m ; x<sub>m</sub> → x, x ∈ <o>F</o> = F : absurde. <span class="qed">∎</span></p>`},
{t:'ex',n:'4.6',ti:'Densité, accumulation',b:`<p>A est <b>dense</b> si <o>A</o> = ℝⁿ (ex : ℚ dense dans ℝ). x est point d’accumulation de A si c’est limite d’une suite de points de A tous différents de x. Exemple : <o>]0,1[</o> = [0,1].</p>`},
{t:'prop',n:'4.7',ti:'Suites de Cauchy',b:`<p>Toute suite de Cauchy est bornée ; toute suite convergente est de Cauchy. ℝⁿ est complet.</p>`,p:`<p>ε=1 : ∀p ≥ N, ‖x<sub>p</sub>−x<sub>N</sub>‖ ≤ 1. Avec M = max(1, ‖x<sub>0</sub>−x<sub>N</sub>‖, …, ‖x<sub>N−1</sub>−x<sub>N</sub>‖), x<sub>m</sub> ∈ B(x<sub>N</sub>,M+1).</p><p>Complétude : chaque coordonnée est de Cauchy dans ℝ, donc converge ; on regroupe les limites. <span class="qed">∎</span></p>`},
{t:'def',n:'4.8',ti:'Sous-suite extraite',b:`<p>(y<sub>m</sub>) = (x<sub>φ(m)</sub>) avec φ : ℕ → ℕ strictement croissante (donc φ(m) ≥ m). Si x<sub>m</sub> → ℓ, toute sous-suite converge vers ℓ.</p>`},
{t:'thm',n:'4.9',ti:'Bolzano-Weierstrass',b:`<p>Toute suite bornée de ℝⁿ admet une sous-suite convergente.</p>`,p:`<p>n = 1 : connu. Sinon (x<sub>m</sub><sup>1</sup>) est bornée dans ℝ : on extrait φ₁ avec (x<sup>1</sup><sub>φ₁(m)</sub>) convergente.</p><p>(x<sup>2</sup><sub>φ₁(m)</sub>) est bornée : on extrait φ₂, etc. Avec φ = φ₁∘…∘φ<sub>n</sub>, toutes les coordonnées de (x<sub>φ(m)</sub>) convergent. <span class="qed">∎</span></p>`},
{t:'thm',n:'4.10',ti:'Compacts de ℝⁿ',b:`<p>A ⊂ ℝⁿ est compacte ⇔ A est fermée et bornée. Si A est ouvert ⇔ A voisinage de chacun de ses points ; x<sub>p</sub> → a ⇔ ∀V<sub>a</sub>, ∃N, p ≥ N ⇒ x<sub>p</sub> ∈ V<sub>a</sub>.</p>`,p:`<p>(⇒) Fermé : x ∈ <o>A</o>, x<sub>m</sub> → x ; sous-suite → y ∈ A ; unicité : x = y ∈ A. Borné : sinon ‖x<sub>m</sub>‖ > m, aucune sous-suite ne converge.</p><p>(⇐) Suite de A bornée : Bolzano-Weierstrass, la limite est dans A car A est fermée. <span class="qed">∎</span></p>`}
]},
{id:'s5',h:'Chap. 5 · Limite et continuité dans ℝⁿ',items:[
{t:'def',n:'5.1',ti:'Limite',b:`<p>A ⊂ ℝⁿ, a ∈ <o>A</o>, f : A → ℝᵐ. f a pour limite ℓ en a si ∀ε>0, ∃η>0, ∀x ∈ A, ‖x−a‖<η ⇒ ‖f(x)−ℓ‖<ε. Équivalent : ∀V<sub>ℓ</sub>, ∃V<sub>a</sub>, f(A∩V<sub>a</sub>) ⊂ V<sub>ℓ</sub>. Pour n=m=1, c’est la définition classique ; version « x → +∞ » : ∀ε ∃B, ‖x‖>B ⇒ ‖f(x)−ℓ‖<ε.</p>`},
{t:'thm',n:'5.2',ti:'Propriétés des limites',b:`<ul><li>Unicité de la limite.</li><li>Une limite finie en a ⇒ f bornée au voisinage de a.</li><li><b>Caractérisation séquentielle</b> : f → ℓ ⇔ pour toute suite x<sub>p</sub> → a, f(x<sub>p</sub>) → ℓ.</li><li>f=(f₁,…,f<sub>m</sub>) → ℓ ⇔ chaque f<sub>i</sub> → ℓ<sub>i</sub>.</li><li><b>Gendarmes</b> : f ≤ g ≤ h localement, f,h → ℓ ⇒ g → ℓ.</li><li><b>Composition</b> : f → b et g → ℓ en b ⇒ g∘f → ℓ.</li><li>Somme, produit h·g (h→0, g bornée ⇒ hg→0), ‖f‖ → ‖ℓ‖.</li></ul>`},
{t:'def',n:'5.3',ti:'Continuité',b:`<p>f est continue en a ∈ A ⇔ lim f = f(a) ⇔ ∀ε ∃η, ‖x−a‖<η ⇒ ‖f(x)−f(a)‖<ε ⇔ pour toute suite x<sub>p</sub> → a, f(x<sub>p</sub>) → f(a). f=(f₁,…,f<sub>m</sub>) est continue ⇔ chaque f<sub>i</sub> l’est (π<sub>j</sub>∘f). La restriction d’une continue est continue.</p>`},
{t:'prop',n:'5.4',ti:'Opérations',b:`<p>La composée de continues est continue ; si f,g continues : f+g, h·f, ‖f‖, 1/f (si f(a) ≠ 0) le sont. Les projections π<sub>k</sub> et toute fonction polynomiale en plusieurs variables sont continues.</p>`},
{t:'thm',n:'5.5',ti:'Continuité et topologie',b:`<p>f : ℝⁿ → ℝᵐ est continue ⇔ l’image réciproque de tout ouvert est ouverte ⇔ l’image réciproque de tout fermé est fermée. Rappel : f<sup>−1</sup>(A∪B) = f<sup>−1</sup>(A)∪f<sup>−1</sup>(B), f<sup>−1</sup>(A∩B) = f<sup>−1</sup>(A)∩f<sup>−1</sup>(B), f<sup>−1</sup>(A<sup>c</sup>) = (f<sup>−1</sup>(A))<sup>c</sup>.</p>`},
{t:'rem',n:'5.6',ti:'Images directes',b:`<p>L’image directe d’un ouvert (ou d’un fermé) n’est pas forcément ouverte (ou fermée) : x ↦ 0 envoie ℝ sur {0} ; exp envoie ℝ (fermé) sur ]0,+∞[.</p>`},
{t:'def',n:'5.7',ti:'Continuité partielle',b:`<p>Pour f : X ⊂ ℝ² → ℝ : f(·,b) : x ↦ f(x,b) et f(a,·) : y ↦ f(a,y) sont les <b>applications partielles</b>. Si f est continue en (a,b), les applications partielles sont continues. La réciproque est fausse.</p>`},
{t:'def',n:'5.8',ti:'Continuité uniforme',b:`<p>f est uniformément continue sur X si ∀ε ∃η, ∀x,y ∈ X, ‖x−y‖<η ⇒ ‖f(x)−f(y)‖<ε. Alors f est continue ; la réciproque est fausse : x ↦ x² est continue sur ℝ mais pas uniformément.</p>`},
{t:'thm',n:'5.9',ti:'Continuité et compacité',b:`<p>L’image d’un compact par une continue est compacte (fermée bornée). Si X est compact non vide et f : X → ℝ continue, f est bornée et atteint ses bornes. <b>Heine</b> : f continue sur un compact X ⇒ f uniformément continue.</p>`},
{t:'thm',n:'5.10',ti:'Applications linéaires continues',b:`<p>f ∈ ℒ(ℝⁿ,ℝᵐ) est continue. La formule |||f||| = sup<sub>x≠0</sub> ‖f(x)‖<sub>m</sub>/‖x‖<sub>n</sub> définit une norme sur ℒ(ℝⁿ,ℝᵐ), avec ‖f(x)‖ ≤ |||f|||·‖x‖, |||Id||| = 1 et |||f∘g||| ≤ |||f|||·|||g|||.</p>`},
{t:'def',n:'5.11',ti:'Convexité et arcs',b:`<p>X est <b>convexe</b> si ∀a,b ∈ X, [a,b] = {ta+(1−t)b : t∈[0,1]} ⊂ X. Toute partie convexe de ℝⁿ est connexe par arcs. Les connexes par arcs de ℝ sont les intervalles. Si A est connexe par arcs et f continue, f(A) est connexe par arcs.</p>`},
{t:'thm',n:'5.12',ti:'Valeurs intermédiaires',b:`<p>Si A ⊂ ℝⁿ est connexe par arcs et f : A → ℝ continue, f prend toutes les valeurs comprises entre deux valeurs qu’elle atteint.</p>`}
]},
{id:'s6',h:'Chap. 6 · Calcul différentiel dans ℝⁿ',items:[
{t:'def',n:'6.1',ti:'Dérivées directionnelle et partielle',b:`<p>U ouvert de ℝⁿ, f : U → ℝᵐ, a ∈ U, v ≠ 0. f admet une dérivée en a suivant v si D<sub>v</sub>f(a) = lim<sub>t→0</sub> (f(a+tv)−f(a))/t existe. Pour v = e<sub>j</sub> (base canonique) on obtient la <b>dérivée partielle</b> ∂f/∂x<sub>j</sub>(a). Elle existe ⇔ celles des composantes f₁,…,f<sub>m</sub> existent, et ∂f/∂x<sub>j</sub> = (∂f₁/∂x<sub>j</sub>,…,∂f<sub>m</sub>/∂x<sub>j</sub>). Exemple : f(x,y) = (x²,3x²y) : ∂f/∂x = (2x,6xy), ∂f/∂y = (0,3x²).</p>`},
{t:'def',n:'6.2',ti:'Classe C¹',b:`<p>f est de classe C¹ sur U si elle admet des dérivées partielles premières en tout point, toutes continues sur U.</p>`},
{t:'prop',n:'6.3',ti:'Développement limité d’ordre 1',b:`<p>Si f est C¹, ∃ε telle que f(a+h) = f(a) + Σ<sub>j</sub> h<sub>j</sub>∂f/∂x<sub>j</sub>(a) + ‖h‖ε(h) avec ε(h) → 0 quand h → 0. En particulier f est continue sur U.</p>`,p:`<p>Avec x = a+h : f(x)−f(a) = Σh<sub>j</sub>∂<sub>j</sub>f(a) + ε(h)‖h‖ → 0 quand x → a. <span class="qed">∎</span></p>`},
{t:'def',n:'6.4',ti:'Différentielle, jacobienne',b:`<p>La <b>différentielle</b> d<sub>a</sub>f : h ↦ Σh<sub>j</sub>∂f/∂x<sub>j</sub>(a) = Σ ∂f/∂x<sub>j</sub>(a)dx<sub>j</sub>. La <b>matrice jacobienne</b> J(f)(a) = (∂f<sub>i</sub>/∂x<sub>j</sub>(a))<sub>i,j</sub> est la matrice de d<sub>a</sub>f dans les bases canoniques ; si n = m, la <b>jacobien</b> est son déterminant. Pour φ linéaire : d<sub>a</sub>φ = φ.</p>`},
{t:'thm',n:'6.5',ti:'Opérations sur les fonctions C¹',b:`<p>Si f est C¹ sur U, g C¹ sur V et f(U) ⊂ V, alors g∘f est C¹ et J(g∘f)(a) = J(g)(f(a))×J(f)(a). Si h, f, g sont C¹, alors hf et f+g le sont.</p>`},
{t:'def',n:'6.6',ti:'Différentiabilité',b:`<p>f est <b>différentiable en a</b> s’il existe L<sub>a</sub> ∈ ℒ(ℝⁿ,ℝᵐ) avec f(a+h) = f(a)+L<sub>a</sub>(h)+o(‖h‖). L<sub>a</sub> est unique : c’est d<sub>a</sub>f.</p>`,p:`<p>Si L, M conviennent, (L−M)(h) = o(‖h‖). Pour v ≠ 0 et t → 0 : (L−M)(tv) = t(L−M)(v) = o(|t|), donc (L−M)(v) = 0. <span class="qed">∎</span></p>`},
{t:'thm',n:'6.7',ti:'Conséquences de la différentiabilité',b:`<ul><li>f différentiable en a ⇒ f continue en a.</li><li>Alors f admet une dérivée suivant tout v, et D<sub>v</sub>f(a) = d<sub>a</sub>f(v).</li><li>En particulier, d<sub>a</sub>f(h) = Σh<sub>j</sub>∂f/∂x<sub>j</sub>(a).</li><li>La réciproque est fausse : f(x,y) = 0 si xy ≠ 0, 1 si xy = 0 a des dérivées partielles en (0,0), mais n’y est pas continue.</li><li>Si les dérivées partielles existent et sont continues en a, f est différentiable en a.</li><li>Composition : d<sub>a</sub>(g∘f) = d<sub>f(a)</sub>g ∘ d<sub>a</sub>f.</li></ul>`,p:`<p>f(a+tv) = f(a)+t·d<sub>a</sub>f(v)+o(‖tv‖), d’où (f(a+tv)−f(a))/t = d<sub>a</sub>f(v)+o(1) quand t → 0. <span class="qed">∎</span></p>`},
{t:'thm',n:'6.8',ti:'Inégalité des accroissements finis',b:`<p>U ouvert, [a,b] ⊂ U, f : U → ℝ de classe C¹ avec Σ<sub>j</sub>|∂f/∂x<sub>j</sub>(x)| ≤ M sur [a,b]. Alors |f(b)−f(a)| ≤ M‖b−a‖<sub>∞</sub>. Corollaire : si U est ouvert connexe par arcs, f C¹ est constante ⇔ toutes ses dérivées partielles sont nulles. (Admis)</p>`},
{t:'def',n:'6.9',ti:'C¹-difféomorphisme',b:`<p>Φ : U → V est un <b>C¹-difféomorphisme</b> si Φ est C¹, bijective et Φ<sup>−1</sup> est C¹. Alors n = m et d<sub>a</sub>Φ est un isomorphisme, avec (d<sub>a</sub>Φ)<sup>−1</sup> = d<sub>Φ(a)</sub>(Φ<sup>−1</sup>). La composée de deux difféomorphismes en est un.</p>`,p:`<p>Id<sub>U</sub> = Φ<sup>−1</sup>∘Φ donc Id = d<sub>Φ(a)</sub>(Φ<sup>−1</sup>)∘d<sub>a</sub>Φ : d<sub>a</sub>Φ est un isomorphisme, d’où n = m. <span class="qed">∎</span></p>`},
{t:'thm',n:'6.10',ti:'Inversion locale',b:`<p>Φ : U → ℝⁿ de classe C¹, a ∈ U. Si det J(Φ)(a) ≠ 0 (d<sub>a</sub>Φ isomorphisme), il existe un voisinage V<sub>a</sub> tel que Φ soit un C¹-difféomorphisme de V<sub>a</sub> sur Φ(V<sub>a</sub>). Corollaire : si Φ est C¹, bijective, avec d<sub>a</sub>Φ isomorphisme pour tout a, c’est un difféomorphisme. Exemple : les coordonnées polaires (r,θ) ↦ (r cos θ, r sin θ) de ]0,+∞[×]−π,π[ dans ℝ²∖{(0,0)}. (Admis)</p>`},
{t:'thm',n:'6.11',ti:'Dérivées successives, Schwarz',b:`<p>Les dérivées partielles d’ordre p se définissent par récurrence : ∂<sup>p</sup>f/∂x<sub>i<sub>p</sub></sub>…∂x<sub>i₁</sub>. L’ordre compte a priori : ∂²f/∂x∂y ≠ ∂²f/∂y∂x. <b>Schwarz</b> : si f est C¹, si ∂²f/∂x<sub>i</sub>∂x<sub>j</sub> et ∂²f/∂x<sub>j</sub>∂x<sub>i</sub> existent sur U et sont continues en a, elles sont égales en a. Si f est C<sup>k</sup>, l’ordre de dérivation n’importe pas (toute permutation σ).</p><p>Exemple : f(x,y) = x<sup>y</sup> : ∂²f/∂y∂x = ∂²f/∂x∂y = x<sup>y−1</sup>(1+y ln x).</p>`}
]},
{id:'s7',h:'Annexe · Démonstrations détaillées pas à pas',items:[
{t:'thm',n:'7.1',ti:'Continuité : les 4 équivalences (détail complet)',b:`<p>f : (<i>E</i>,τ) → (<i>F</i>,τ′). Équivalence : (a) f continue ; (b) f<sup>−1</sup>(ouvert) ouvert ; (c) f<sup>−1</sup>(fermé) fermé ; (d) ∀A ⊂ <i>E</i>, f(<o>A</o>) ⊂ <o>f(A)</o>.</p>`,p:`<p><em>Plan.</em> On montre a⇒d, d⇒c, c⇒b, b⇒a : la boucle prouve l’équivalence des quatre.</p><p><em>a⇒d (1).</em> Soit A ⊂ <i>E</i>. Il faut prouver : tout point de f(<o>A</o>) est adhérent à f(A). Prenons y ∈ f(<o>A</o>) : y = f(a) avec a ∈ <o>A</o>.</p><p><em>a⇒d (2).</em> Pour montrer f(a) ∈ <o>f(A)</o>, on prend un voisinage quelconque W de f(a) et on doit montrer W ∩ f(A) ≠ ∅.</p><p><em>a⇒d (3).</em> f est continue en a : ∃U ∈ 𝒱<sub>a</sub> avec f(U) ⊂ W.</p><p><em>a⇒d (4).</em> Comme a ∈ <o>A</o>, tout voisinage de a rencontre A, donc U ∩ A ≠ ∅. Prenons z ∈ U ∩ A.</p><p><em>a⇒d (5).</em> Alors f(z) ∈ f(U) ⊂ W et f(z) ∈ f(A). Donc f(z) ∈ W ∩ f(A) ≠ ∅. Ainsi f(a) ∈ <o>f(A)</o>.</p><p><em>d⇒c (1).</em> Soit V un fermé de <i>F</i> et W = f<sup>−1</sup>(V). On veut W fermé, c’est-à-dire <o>W</o> ⊂ W (l’inclusion inverse est automatique).</p><p><em>d⇒c (2).</em> f(W) = f(f<sup>−1</sup>(V)) ⊂ V, donc <o>f(W)</o> ⊂ <o>V</o> = V car V est fermé.</p><p><em>d⇒c (3).</em> Soit x ∈ <o>W</o>. Par (d) : f(x) ∈ f(<o>W</o>) ⊂ <o>f(W)</o> ⊂ V. Donc x ∈ f<sup>−1</sup>(V) = W. D’où <o>W</o> = W : W est fermé.</p><p><em>c⇒b.</em> Soit U ouvert de <i>F</i>. U<sup>c</sup> est fermé, donc f<sup>−1</sup>(U<sup>c</sup>) est fermé. Or f<sup>−1</sup>(U<sup>c</sup>) = {x : f(x) ∉ U} = <i>E</i> ∖ f<sup>−1</sup>(U). Donc f<sup>−1</sup>(U) est un ouvert.</p><p><em>b⇒a (1).</em> Soit x₀ ∈ <i>E</i> et V ∈ 𝒱<sub>f(x₀)</sub>. Par définition, il existe un ouvert W′ de <i>F</i> avec f(x₀) ∈ W′ ⊂ V.</p><p><em>b⇒a (2).</em> Posons U = f<sup>−1</sup>(W′). Par (b), U est ouvert ; et x₀ ∈ U car f(x₀) ∈ W′. Donc U ∈ 𝒱<sub>x₀</sub>.</p><p><em>b⇒a (3).</em> Enfin f(U) ⊂ W′ ⊂ V. Donc f tend vers f(x₀) en x₀ : f est continue en x₀, pour tout x₀. <span class="qed">∎</span></p>`},
{t:'thm',n:'7.2',ti:'Compact ⇒ fermé dans un séparé (détail complet)',b:`<p>Soit (<i>E</i>,τ) séparé et A ⊂ <i>E</i> compacte. Alors A est fermée.</p>`,p:`<p><em>Objectif.</em> Montrer que A<sup>c</sup> est ouvert, i.e. voisinage de chacun de ses points (th. 1.6).</p><p><em>Cas 1.</em> Si A<sup>c</sup> = ∅, alors A = <i>E</i>, fermé. Sinon on passe au cas 2.</p><p><em>Cas 2 (1).</em> Fixons x ∈ A<sup>c</sup>. Pour chaque y ∈ A on a x ≠ y.</p><p><em>Cas 2 (2).</em> <i>E</i> est séparé : il existe des ouverts O<sub>xy</sub> ∋ x et O<sub>y</sub> ∋ y tels que O<sub>xy</sub> ∩ O<sub>y</sub> = ∅.</p><p><em>Cas 2 (3).</em> La famille (O<sub>y</sub>)<sub>y∈A</sub> recouvre A (car y ∈ O<sub>y</sub>). Par compacité de A (prop. 2.1.10), on extrait y₁,…,y<sub>n</sub> avec A ⊂ O<sub>y₁</sub> ∪ … ∪ O<sub>yₙ</sub>.</p><p><em>Cas 2 (4).</em> Posons O = O<sub>xy₁</sub> ∩ … ∩ O<sub>xyₙ</sub>. Intersection <b>finie</b> d’ouverts contenant x : O est un ouvert contenant x. (C’est ici que la finitude sert.)</p><p><em>Cas 2 (5).</em> Pour chaque i, O ⊂ O<sub>xyᵢ</sub> et O<sub>xyᵢ</sub> ∩ O<sub>yᵢ</sub> = ∅, donc O ∩ O<sub>yᵢ</sub> = ∅. Alors O ∩ (⋃O<sub>yᵢ</sub>) = ∅, donc O ∩ A = ∅.</p><p><em>Conclusion.</em> O ⊂ A<sup>c</sup> avec x ∈ O : A<sup>c</sup> est voisinage de x. Ceci vaut pour tout x ∈ A<sup>c</sup>, donc A<sup>c</sup> est ouvert et A est fermé. <span class="qed">∎</span></p>`},
{t:'thm',n:'7.3',ti:'Image d’un compact et bijection continue (détail complet)',b:`<p>(a) f continue, A compact ⇒ f(A) compact. (b) <i>E</i> compact, <i>F</i> séparé, f bijective continue ⇒ f homéomorphisme.</p>`,p:`<p><em>(a) (1).</em> Soit (U<sub>i</sub>)<sub>i∈I</sub> une famille d’ouverts de <i>F</i> avec f(A) ⊂ ⋃U<sub>i</sub>.</p><p><em>(a) (2).</em> Alors A ⊂ f<sup>−1</sup>(f(A)) ⊂ f<sup>−1</sup>(⋃U<sub>i</sub>) = ⋃f<sup>−1</sup>(U<sub>i</sub>).</p><p><em>(a) (3).</em> f est continue : chaque f<sup>−1</sup>(U<sub>i</sub>) est un ouvert de <i>E</i>. C’est un recouvrement ouvert de A.</p><p><em>(a) (4).</em> A compact : il existe I₀ fini avec A ⊂ ⋃<sub>I₀</sub> f<sup>−1</sup>(U<sub>i</sub>).</p><p><em>(a) (5).</em> Donc f(A) ⊂ f(⋃<sub>I₀</sub> f<sup>−1</sup>(U<sub>i</sub>)) ⊂ ⋃<sub>I₀</sub> U<sub>i</sub>. Sous-recouvrement fini obtenu : f(A) est compact.</p><p><em>(b) (1).</em> Il suffit de montrer que f<sup>−1</sup> est continue, i.e. (th. 7.1 c) que pour tout fermé U de <i>E</i>, (f<sup>−1</sup>)<sup>−1</sup>(U) = f(U) est fermé dans <i>F</i>.</p><p><em>(b) (2).</em> U fermé dans <i>E</i> compact : U est compact (th. 2.4). Puis f(U) est compact par (a).</p><p><em>(b) (3).</em> <i>F</i> est séparé et f(U) y est compact : f(U) est fermé (th. 7.2). Donc f<sup>−1</sup> est continue et f est un homéomorphisme. <span class="qed">∎</span></p>`},
{t:'thm',n:'7.4',ti:'Dimension finie : normes équivalentes (détail complet)',b:`<p>Sur un 𝕂-ev <i>E</i> de dimension n, toutes les normes sont équivalentes.</p>`,p:`<p><em>Étape 1.</em> Soit (e<sub>k</sub>) une base. Tout x s’écrit x = Σa<sub>k</sub>e<sub>k</sub>. Posons p(x) = Σ|a<sub>k</sub>| : c’est une norme sur <i>E</i>. On montre que toute norme ‖·‖ est équivalente à p ; par transitivité, deux normes quelconques le sont.</p><p><em>Étape 2 : majoration.</em> ‖x‖ ≤ Σ|a<sub>k</sub>|‖e<sub>k</sub>‖ ≤ b·p(x) avec b = max‖e<sub>k</sub>‖.</p><p><em>Étape 3 : ‖·‖ est continue pour p.</em> | ‖x<sub>m</sub>‖ − ‖x‖ | ≤ ‖x<sub>m</sub>−x‖ ≤ b·p(x<sub>m</sub>−x) → 0 si x<sub>m</sub> → x pour p.</p><p><em>Étape 4 : un compact.</em> φ : (ℝⁿ,‖·‖₁) → (<i>E</i>,p), (α<sub>k</sub>) ↦ Σα<sub>k</sub>e<sub>k</sub> est continue (isométrique). La sphère M = {Σ|α<sub>k</sub>| = 1} est fermée bornée dans ℝⁿ, donc compacte. Alors K = φ(M) = {x : p(x) = 1} est compact dans (<i>E</i>,p).</p><p><em>Étape 5 : minimum.</em> ‖·‖ est continue sur le compact K : elle atteint un minimum a = ‖x₀‖ avec x₀ ∈ K. Comme x₀ ≠ 0 (p(x₀)=1), a > 0.</p><p><em>Étape 6 : minoration.</em> Pour x ≠ 0, x/p(x) ∈ K donc ‖x/p(x)‖ ≥ a, soit ‖x‖ ≥ a·p(x). Pour x = 0 c’est trivial.</p><p><em>Conclusion.</em> a·p(x) ≤ ‖x‖ ≤ b·p(x) pour tout x : les normes sont équivalentes. <span class="qed">∎</span></p>`},
{t:'thm',n:'7.5',ti:'Bolzano-Weierstrass et compacts de ℝⁿ (détail complet)',b:`<p>(a) Toute suite bornée de ℝⁿ a une sous-suite convergente. (b) A ⊂ ℝⁿ est compacte ⇔ fermée et bornée.</p>`,p:`<p><em>(a) (1).</em> Soit (x<sub>m</sub>) bornée : ‖x<sub>m</sub>‖<sub>∞</sub> ≤ A. Donc chaque suite coordonnée (x<sub>m</sub><sup>i</sup>) vérifie |x<sub>m</sub><sup>i</sup>| ≤ A : elle est bornée dans ℝ.</p><p><em>(a) (2).</em> Dans ℝ (1<sup>re</sup> étape du cours) : il existe φ₁ strictement croissante telle que (x<sup>1</sup><sub>φ₁(m)</sub>) converge.</p><p><em>(a) (3).</em> La suite (x<sup>2</sup><sub>φ₁(m)</sub>) est bornée : il existe φ₂ avec (x<sup>2</sup><sub>φ₁∘φ₂(m)</sub>) convergente. La première coordonnée, sous-suite d’une suite convergente, converge encore.</p><p><em>(a) (4).</em> On répète n fois. Avec φ = φ₁∘φ₂∘…∘φ<sub>n</sub> (strictement croissante), chaque coordonnée de (x<sub>φ(m)</sub>) converge, donc (x<sub>φ(m)</sub>) converge dans ℝⁿ.</p><p><em>(b, ⇒) fermé.</em> Soit x ∈ <o>A</o> : ∃x<sub>m</sub> ∈ A, x<sub>m</sub> → x. A compacte : une sous-suite x<sub>φ(m)</sub> → y ∈ A. Une sous-suite de (x<sub>m</sub>) tend aussi vers x, donc x = y ∈ A (unicité). Ainsi <o>A</o> = A.</p><p><em>(b, ⇒) borné.</em> Sinon, pour tout m il existe x<sub>m</sub> ∈ A avec ‖x<sub>m</sub>‖ > m. Aucune sous-suite ne peut converger (une suite convergente est bornée) : absurde.</p><p><em>(b, ⇐).</em> A fermée bornée, (x<sub>m</sub>) ⊂ A est bornée : par (a), une sous-suite converge vers x ∈ ℝⁿ. Comme x ∈ <o>A</o> = A (A fermée), la limite est dans A : A est compacte. <span class="qed">∎</span></p>`},
{t:'prop',n:'7.6',ti:'Intérieur et adhérence (détail complet)',b:`<p>Pour A ⊂ <i>E</i> : A° est le plus grand ouvert inclus dans A, <o>A</o> est le plus petit fermé contenant A, et (<o>A</o>)<sup>c</sup> = (A<sup>c</sup>)°.</p>`,p:`<p><em>1. A° est ouvert (1).</em> Soit a ∈ A°. Par définition A ∈ 𝒱<sub>a</sub> : il existe un ouvert W avec a ∈ W ⊂ A.</p><p><em>1. (2).</em> Soit x ∈ W quelconque. W est un ouvert contenant x et inclus dans A, donc A ∈ 𝒱<sub>x</sub>, c’est-à-dire x ∈ A°. Ainsi W ⊂ A°.</p><p><em>1. (3).</em> A° contient donc un ouvert W autour de chacun de ses points a : A° est voisinage de tous ses points, donc ouvert (th. 1.6).</p><p><em>2. Plus grand ouvert.</em> Soit U ouvert, U ⊂ A. Pour x ∈ U, U est un ouvert contenant x inclus dans A : x ∈ A°. Donc U ⊂ A°. Avec A° ouvert et A° ⊂ A, c’est le plus grand.</p><p><em>3. Complémentaire (1).</em> x ∈ (<o>A</o>)<sup>c</sup> ⇔ x n’est pas adhérent ⇔ ∃V ∈ 𝒱<sub>x</sub>, V ∩ A = ∅.</p><p><em>3. (2).</em> V ∩ A = ∅ ⇔ V ⊂ A<sup>c</sup> ⇔ A<sup>c</sup> ∈ 𝒱<sub>x</sub> (un sur-ensemble d’un voisinage est un voisinage) ⇔ x ∈ (A<sup>c</sup>)°.</p><p><em>3. (3).</em> Comme (A<sup>c</sup>)° est ouvert (point 1), son complémentaire <o>A</o> est fermé.</p><p><em>4. Plus petit fermé.</em> Soit F fermé avec A ⊂ F. Alors F<sup>c</sup> est un ouvert inclus dans A<sup>c</sup>, donc F<sup>c</sup> ⊂ (A<sup>c</sup>)° = (<o>A</o>)<sup>c</sup> (point 2). En passant au complémentaire : <o>A</o> ⊂ F. <span class="qed">∎</span></p>`},
{t:'prop',n:'7.7',ti:'Base d’ouverts ⇔ bases de voisinages (détail complet)',b:`<p>𝒳 ⊂ τ est une base d’ouverts ⇔ ∀x, 𝒳<sub>x</sub> = {b ∈ 𝒳 : x ∈ b} est une base de voisinages de x.</p>`,p:`<p><em>(⇒) (1).</em> Soit x ∈ <i>E</i> et V ∈ 𝒱<sub>x</sub>. Il existe un ouvert W avec x ∈ W ⊂ V.</p><p><em>(⇒) (2).</em> 𝒳 est une base : W = ⋃<sub>i∈I</sub> b<sub>i</sub> avec b<sub>i</sub> ∈ 𝒳.</p><p><em>(⇒) (3).</em> x ∈ W donc x ∈ b<sub>i₀</sub> pour un i₀. Alors b<sub>i₀</sub> ∈ 𝒳<sub>x</sub> et x ∈ b<sub>i₀</sub> ⊂ W ⊂ V : 𝒳<sub>x</sub> est une base de voisinages.</p><p><em>(⇐) (1).</em> Soit O ouvert. Pour x ∈ O, O ∈ 𝒱<sub>x</sub> (un ouvert est voisinage de ses points).</p><p><em>(⇐) (2).</em> 𝒳<sub>x</sub> est une base de voisinages : il existe b<sub>x</sub> ∈ 𝒳<sub>x</sub> avec x ∈ b<sub>x</sub> ⊂ O.</p><p><em>(⇐) (3).</em> Alors ⋃<sub>x∈O</sub> b<sub>x</sub> ⊂ O, et O ⊂ ⋃<sub>x∈O</sub> b<sub>x</sub> car chaque x ∈ b<sub>x</sub>. Donc O = ⋃ b<sub>x</sub> : 𝒳 est une base d’ouverts. <span class="qed">∎</span></p>`},
{t:'prop',n:'7.8',ti:'Singletons fermés dans un séparé (détail complet)',b:`<p>Dans un espace séparé, tout singleton {x} est fermé.</p>`,p:`<p><em>Objectif.</em> {x} fermé ⇔ {x}<sup>c</sup> ouvert ⇔ {x}<sup>c</sup> voisinage de chacun de ses points.</p><p><em>(1).</em> Soit x′ ∈ {x}<sup>c</sup>, donc x′ ≠ x.</p><p><em>(2).</em> Par séparation : il existe des ouverts W ∋ x et W′ ∋ x′ avec W ∩ W′ = ∅.</p><p><em>(3).</em> x ∈ W et W ∩ W′ = ∅ donc x ∉ W′. Donc W′ ⊂ {x}<sup>c</sup>.</p><p><em>(4).</em> W′ est un ouvert avec x′ ∈ W′ ⊂ {x}<sup>c</sup> : {x}<sup>c</sup> est un voisinage de x′, et ce pour tout x′.</p><p><em>Conclusion.</em> {x}<sup>c</sup> est ouvert, donc {x} est fermé. <span class="qed">∎</span></p>`},
{t:'thm',n:'7.9',ti:'Unicité de la limite (détail complet)',b:`<p>Si <i>F</i> est séparé et f admet une limite en a, cette limite est unique.</p>`,p:`<p><em>(1).</em> Supposons deux limites b ≠ b′.</p><p><em>(2).</em> <i>F</i> séparé : V ∈ 𝒱<sub>b</sub> et V′ ∈ 𝒱<sub>b′</sub> avec V ∩ V′ = ∅.</p><p><em>(3).</em> f → b : ∃U ∈ 𝒱<sub>a</sub>, f(U) ⊂ V. f → b′ : ∃U′ ∈ 𝒱<sub>a</sub>, f(U′) ⊂ V′.</p><p><em>(4).</em> U ∩ U′ ∈ 𝒱<sub>a</sub> (intersection finie de voisinages), donc a ∈ U ∩ U′ et f(a) ∈ f(U ∩ U′).</p><p><em>(5).</em> Mais f(U ∩ U′) ⊂ f(U) ∩ f(U′) ⊂ V ∩ V′ = ∅. Contradiction. <span class="qed">∎</span></p>`},
{t:'thm',n:'7.10',ti:'Applications linéaires continues (détail complet)',b:`<p>f linéaire : continue en 0 ⇔ ∃M, ∀x ∈ B(0,1), ‖f(x)‖′ ≤ M ⇔ ∃M, ∀x, ‖f(x)‖′ ≤ M‖x‖ ⇔ uniformément continue.</p>`,p:`<p><em>a⇒b (1).</em> Continuité en 0 avec ε = 1 : ∃r > 0, ‖y‖ < r ⇒ ‖f(y)‖′ < 1 (car f(0) = 0).</p><p><em>a⇒b (2).</em> Soit x ∈ B(0,1), x ≠ 0. Posons y = r·x : ‖y‖ = r‖x‖ < r, donc ‖f(y)‖′ = r‖f(x)‖′ < 1.</p><p><em>a⇒b (3).</em> D’où ‖f(x)‖′ < 1/r. On prend M = 1/r.</p><p><em>b⇒c.</em> Soit x ≠ 0. x/‖x‖ est de norme 1 : attention, on utilise la boule fermée ou on remplace x par (1−ε)x/‖x‖ puis ε → 0 ; par linéarité ‖f(x)‖′ = ‖x‖·‖f(x/‖x‖)‖′ ≤ M‖x‖.</p><p><em>c⇒d.</em> ‖f(x)−f(y)‖′ = ‖f(x−y)‖′ ≤ M‖x−y‖ : f est M-lipschitzienne, donc uniformément continue (r = ε/M).</p><p><em>d⇒a.</em> Évident. <span class="qed">∎</span></p>`}
]}
